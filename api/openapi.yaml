openapi: 3.0.3
info:
  title: Ledger API
  version: 0.6.0
  description: |
    API for a lightweight double-entry accounting ledger.

    ## Money
    Every monetary value is an **integer number of cents**. Floating-point
    numbers are never used. Integers are capped at 9007199254740991 (2^53 - 1)
    so they are exact in JavaScript.

    ## Currencies (CAD and USD)
    Every account has one fixed currency, and each line is in its account's
    currency. A journal entry must balance **within each currency**. Amounts
    in different currencies are never added together: reports give totals per
    currency. To move value between currencies, post through an FX clearing
    account in each currency (type `equity`, e.g. "Currency trading"), e.g.
    buying USD 1,000.00 for CAD 1,370.00:

    | account               | debit    | credit   |
    |-----------------------|----------|----------|
    | 1900 FX clearing CAD  | 1370.00  |          |
    | 1000 Bank CAD         |          | 1370.00  |
    | 1010 Bank USD         | 1000.00  |          |
    | 1910 FX clearing USD  |          | 1000.00  |

    ## Accounts are identified by code
    Accounts are referenced everywhere by their `code` (e.g. `1000`), which
    never changes once created. Internal database ids are not exposed.

    ## Double entry
    A journal entry has at least two lines. Each line is either a debit or a
    credit: exactly one of `debit_cents` / `credit_cents` is greater than zero
    and the other is zero. The database enforces these rules as well.

    ## Immutability
    Posted journal entries cannot be edited or deleted. To correct a mistake,
    post a reversing entry (`POST /journal-entries/{id}/reverse`) and then a
    new, correct entry.

    ## CSV files
    Exports and imports live in the server's CSV directory (`/app/csv_data`).
    Exports are UTF-8 encoded, comma separated, with a header row and no BOM.
    Files can be added by uploading them (`POST /files`) or by copying them
    to the share directly.

    ## Authentication
    Log in with `POST /auth/login`; the server sets an HttpOnly, SameSite=Strict
    session cookie (`ledger_session`). Every endpoint except `/health`,
    `/auth/login` and `/auth/logout` requires it and answers 401 without it.
    Sessions end after 8 hours of inactivity or 7 days. Users are managed on
    the server with `ledger user add|passwd|disable|enable|list`; there is no
    self-registration. Repeated failed logins are refused with 429 for 15
    minutes: 10 per username and client, or 30 per username from anywhere.

    ## Automatic updates
    `/system/update` shows the installed version and the updater's status,
    and stores the update schedule. A root service on the server
    (`ledger-update.timer`) reads the schedule, installs new GitHub releases
    and reboots the container. The app itself never installs anything.

    ## Modules
    Modules add features (invoicing, dashboards, integrations) from GitHub
    repositories. `/modules` lists them and records which ones you want; the
    root updater installs them. A running module serves its own API under
    `/api/v1/m/{moduleId}/...` (session required) and its UI under
    `/m/{moduleId}/`. See docs/MODULES.md.

    ## Requests
    JSON request bodies must be sent with `Content-Type: application/json`
    (otherwise 415). Cross-site state-changing requests from browsers are
    rejected with 403, so other web pages cannot act on the ledger.
servers:
  - url: /api/v1

security:
  - sessionCookie: []

tags:
  - name: Auth
  - name: System
  - name: Dashboard
  - name: Accounts
  - name: Journal Entries
  - name: Reports
  - name: Reconciliation
  - name: Files
  - name: Modules
  - name: Users
  - name: Integrations

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in and receive a session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in; `Set-Cookie` carries the session
          headers:
            Set-Cookie:
              schema: { type: string, example: 'ledger_session=...; Path=/; HttpOnly; SameSite=Strict' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the current session
      security: []
      responses:
        '204': { description: Logged out (cookie cleared) }
        default: { $ref: '#/components/responses/Error' }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: The logged-in user, the organization this session works in and the ones they can open
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /auth/organization:
    post:
      tags: [Auth]
      operationId: switchOrganization
      summary: Work in another organization's books (this session)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organization_id]
              properties:
                organization_id: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Switched
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /organizations:
    get:
      tags: [Users]
      operationId: listOrganizations
      summary: Organizations (all of them for admins of the main books, otherwise yours)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/Organization' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Users]
      operationId: createOrganization
      summary: Create an organization with books of its own (admin of the main books; you become its admin)
      description: |
        Its database is created right away by the updater (status "pending"
        until then, usually seconds). With `chart`, it starts with a basic
        chart of accounts for the kind of books in that currency.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /organizations/{orgId}:
    patch:
      tags: [Users]
      operationId: updateOrganization
      summary: Rename an organization (admin of the main books)
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /auth/password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change your own password (ends your other sessions)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChange' }
      responses:
        '204': { description: Password changed }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /settings/sidebar:
    get:
      tags: [Auth]
      operationId: getSidebar
      summary: The current user's sidebar order and hidden entries
      responses:
        '200':
          description: Sidebar preferences (empty means the default order)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SidebarPrefs' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [Auth]
      operationId: putSidebar
      summary: Save the current user's sidebar order and hidden entries
      description: |
        Entries are listed in display order. Entries not listed (for example a
        module installed later) are shown after the listed ones.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SidebarPrefs' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SidebarPrefs' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /health:
    get:
      tags: [System]
      operationId: getHealth
      security: []
      summary: Liveness and database connectivity check
      responses:
        '200':
          description: Service and database are reachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Database unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /currencies:
    get:
      tags: [System]
      operationId: listCurrencies
      summary: List supported currencies
      responses:
        '200':
          description: Currencies ordered by code
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CurrencyInfo' }
        default: { $ref: '#/components/responses/Error' }

  /accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List the chart of accounts
      parameters:
        - name: include_inactive
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Accounts ordered by code
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Account' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /accounts/{accountCode}:
    parameters:
      - $ref: '#/components/parameters/AccountCode'
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get one account with its current balance
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Accounts]
      operationId: updateAccount
      summary: Rename, re-describe or (de)activate an account
      description: |
        The account `code`, `type` and `currency` are not editable. Inactive accounts
        keep their history but cannot receive new postings.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountUpdate' }
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /accounts/{accountCode}/ledger:
    parameters:
      - $ref: '#/components/parameters/AccountCode'
    get:
      tags: [Accounts]
      operationId: getAccountLedger
      summary: Posting history of one account with running balance (in the account's currency)
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Ledger lines ordered by date, entry id, line number
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountLedger' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /journal-entries:
    get:
      tags: [Journal Entries]
      operationId: listJournalEntries
      summary: List posted journal entries (newest first)
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: account_code
          in: query
          description: Only entries with at least one line on this account
          schema: { $ref: '#/components/schemas/AccountCode' }
        - name: entity_id
          in: query
          description: Only entries with this customer or vendor
          schema: { type: integer }
        - name: hide_reversed
          in: query
          description: Leave out entries that were reversed and the reversing entries
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of journal entries
          content:
            application/json:
              schema:
                type: object
                required: [data, limit, offset]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/JournalEntry' }
                  limit: { type: integer }
                  offset: { type: integer }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Journal Entries]
      operationId: createJournalEntry
      summary: Post a balanced journal entry
      description: |
        The header and all lines are written in a single database transaction.
        If any line is invalid, or the entry does not balance in every
        currency, nothing is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JournalEntryCreate' }
            example:
              entry_date: '2026-10-01'
              description: Office supplies paid in cash
              reference: RCPT-0042
              lines:
                - { account_code: '6100', debit_cents: 4599, credit_cents: 0, memo: Printer paper }
                - { account_code: '1000', debit_cents: 0, credit_cents: 4599 }
      responses:
        '201':
          description: Entry posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntry' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /journal-entries/{entryId}:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    get:
      tags: [Journal Entries]
      operationId: getJournalEntry
      summary: Get one journal entry with its lines
      responses:
        '200':
          description: The journal entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntry' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /journal-entries/{entryId}/reverse:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    post:
      tags: [Journal Entries]
      operationId: reverseJournalEntry
      summary: Post a reversing entry (swaps every debit and credit)
      description: An entry can be reversed only once, and a reversal cannot itself be reversed.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReverseRequest' }
      responses:
        '201':
          description: Reversing entry posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntry' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Financial summary, notifications and to-dos
      description: |
        The summary is per currency (currencies are never added together):
        net worth (assets minus liabilities) today, revenue, expenses and net
        income for this month and year to date, and the largest expense
        accounts this month. Notifications are the ones not dismissed or
        expired; to-dos are the open ones, then those done in the last 7 days.
        Modules post items with `ctx.dashboard` (see docs/MODULES.md).
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        default: { $ref: '#/components/responses/Error' }

  /dashboard/items/{itemId}/close:
    post:
      tags: [Dashboard]
      operationId: closeDashboardItem
      summary: Dismiss a notification or mark a to-do done
      parameters:
        - { $ref: '#/components/parameters/ItemId' }
      responses:
        '200':
          description: The item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardItem' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /dashboard/items/{itemId}/reopen:
    post:
      tags: [Dashboard]
      operationId: reopenDashboardItem
      summary: Mark a to-do not done
      parameters:
        - { $ref: '#/components/parameters/ItemId' }
      responses:
        '200':
          description: The to-do
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardItem' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /reconciliations:
    get:
      tags: [Reconciliation]
      operationId: listReconciliations
      summary: Reconciliations, in progress first, then newest statement first
      parameters:
        - name: account_code
          in: query
          schema: { $ref: '#/components/schemas/AccountCode' }
        - name: year
          in: query
          description: Only reconciliations whose statement ends in this year
          schema: { type: integer }
      responses:
        '200':
          description: Reconciliations
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Reconciliation' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Reconciliation]
      operationId: createReconciliation
      summary: Start reconciling an account against a statement
      description: |
        One reconciliation per account can be in progress. The statement date
        can't be before the account's last finished reconciliation. The
        balance is in the account's natural sign (what the statement shows:
        money in the bank, or the amount owed on a card).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [account_code, statement_date, statement_balance_cents]
              properties:
                account_code: { $ref: '#/components/schemas/AccountCode' }
                statement_date: { type: string, format: date }
                statement_balance_cents: { $ref: '#/components/schemas/SignedCents' }
      responses:
        '201':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationDetail' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /reconciliations/{reconciliationId}:
    get:
      tags: [Reconciliation]
      operationId: getReconciliation
      summary: A reconciliation with its lines and balances
      parameters:
        - { $ref: '#/components/parameters/ReconciliationId' }
      responses:
        '200':
          description: Reconciliation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationDetail' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Reconciliation]
      operationId: updateReconciliation
      summary: Change the statement date or balance (in progress only)
      parameters:
        - { $ref: '#/components/parameters/ReconciliationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                statement_date: { type: string, format: date }
                statement_balance_cents: { $ref: '#/components/schemas/SignedCents' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationDetail' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Reconciliation]
      operationId: deleteReconciliation
      summary: Discard a reconciliation in progress
      parameters:
        - { $ref: '#/components/parameters/ReconciliationId' }
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /reconciliations/{reconciliationId}/cleared:
    post:
      tags: [Reconciliation]
      operationId: changeCleared
      summary: Tick or untick lines
      parameters:
        - { $ref: '#/components/parameters/ReconciliationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                clear:
                  type: array
                  items: { type: integer, format: int64 }
                unclear:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationDetail' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /reconciliations/{reconciliationId}/finish:
    post:
      tags: [Reconciliation]
      operationId: finishReconciliation
      summary: Finish (the difference must be 0)
      parameters:
        - { $ref: '#/components/parameters/ReconciliationId' }
      responses:
        '200':
          description: Finished
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationDetail' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /reconciliations/{reconciliationId}/undo:
    post:
      tags: [Reconciliation]
      operationId: undoReconciliation
      summary: Reopen the account's most recent finished reconciliation
      parameters:
        - { $ref: '#/components/parameters/ReconciliationId' }
      responses:
        '200':
          description: Reopened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationDetail' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /reports/trial-balance:
    get:
      tags: [Reports]
      operationId: getTrialBalance
      summary: Debit/credit balance of every account as of a date, totalled per currency
      parameters:
        - name: as_of
          in: query
          description: Include entries dated on or before this day (default today)
          schema: { type: string, format: date }
        - name: currency
          in: query
          description: Only accounts in this currency
          schema: { $ref: '#/components/schemas/Currency' }
      responses:
        '200':
          description: Trial balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrialBalance' }
        default: { $ref: '#/components/responses/Error' }

  /reports/balance-sheet:
    get:
      tags: [Reports]
      operationId: getBalanceSheet
      summary: Assets, liabilities and equity as of a date, per currency
      description: |
        Amounts use each account's natural sign. Revenue minus expenses to
        date (not yet closed to an equity account) is reported as
        `net_income_cents` and included in total equity, so
        assets = liabilities + equity.
      parameters:
        - name: as_of
          in: query
          description: Include entries dated on or before this day (default today)
          schema: { type: string, format: date }
        - name: currency
          in: query
          schema: { $ref: '#/components/schemas/Currency' }
      responses:
        '200':
          description: Balance sheet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceSheet' }
        default: { $ref: '#/components/responses/Error' }

  /reports/income-statement:
    get:
      tags: [Reports]
      operationId: getIncomeStatement
      summary: Revenue, expenses and net income for a period, per currency
      parameters:
        - name: from
          in: query
          description: Inclusive start date (default January 1 of the `to` year)
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive end date (default today)
          schema: { type: string, format: date }
        - name: currency
          in: query
          schema: { $ref: '#/components/schemas/Currency' }
      responses:
        '200':
          description: Income statement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncomeStatement' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /exports/general-ledger:
    post:
      tags: [Files]
      operationId: exportGeneralLedger
      summary: Write the General Ledger to a CSV file in the CSV directory
      description: |
        Columns: `account_code,account_name,account_type,currency,entry_date,
        journal_entry_id,line_id,line_number,reference,description,memo,debit,
        credit,running_balance`. Rows are grouped by account; the running
        balance is per account (debit-positive) in that account's currency.
        When `from` is given, each account starts with an "Opening balance" row.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportRequest' }
      responses:
        '201':
          description: File written
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsvFile' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /files:
    get:
      tags: [Files]
      operationId: listCsvFiles
      summary: List CSV files in the CSV directory
      responses:
        '200':
          description: Files, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CsvFile' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Files]
      operationId: uploadCsvFile
      summary: Upload a CSV file into the CSV directory
      description: |
        The file is stored under its own name, which must match the
        `CsvFilename` pattern. Existing files are never overwritten (409).
        Max 10 MiB; content must be UTF-8 text (a leading BOM is allowed).
        Uploading does not import anything: call `POST /imports/journal-entries`
        afterwards.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: File stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsvFile' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /files/{filename}:
    parameters:
      - $ref: '#/components/parameters/Filename'
    get:
      tags: [Files]
      operationId: downloadCsvFile
      summary: Download a CSV file
      responses:
        '200':
          description: File contents
          content:
            text/csv:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /migrations:
    get:
      tags: [Files]
      operationId: getMigrationInfo
      summary: What migrating from other software can do here (whether an LLM can read the files)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ai_available, kinds, max_bytes]
                properties:
                  ai_available: { type: boolean }
                  kinds: { type: array, items: { $ref: '#/components/schemas/MigrationKind' } }
                  max_bytes: { type: integer }
    post:
      tags: [Files]
      operationId: uploadMigration
      summary: Upload an export from other bookkeeping software and see what it is
      description: |
        Accepts CSV or tab-separated text (UTF-8, Windows-1252 or UTF-16).
        The LLM set up under Settings → LLM API (or header rules) works out
        what the file holds and how its columns map to Ledger's; nothing is
        written until /migrations/{uploadId}/import. Uploads are kept for two
        hours, for the user who made them.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                use_ai: { type: string, enum: ['true', 'false'], default: 'true' }
      responses:
        '201':
          description: What was found, and what importing would do
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationPlan' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /migrations/{uploadId}/preview:
    post:
      tags: [Files]
      operationId: previewMigration
      summary: What importing would do with a changed mapping
      parameters:
        - { name: uploadId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { mapping: { $ref: '#/components/schemas/MigrationMappingChange' } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationPlan' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /migrations/{uploadId}/import:
    post:
      tags: [Files]
      operationId: runMigration
      summary: Import it (all or nothing), or hand a customer/vendor list to a module
      parameters:
        - { name: uploadId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mapping: { $ref: '#/components/schemas/MigrationMappingChange' }
                recipient: { type: string, description: 'customers / vendors: the module to send the list to' }
      responses:
        '200':
          description: Imported
          content:
            application/json:
              schema:
                type: object
                required: [kind, accounts_created, entries_created, import_id, sent_to, file_id]
                properties:
                  kind: { $ref: '#/components/schemas/MigrationKind' }
                  accounts_created: { type: integer }
                  entries_created: { type: integer }
                  import_id: { type: integer, nullable: true }
                  sent_to: { type: string, nullable: true }
                  file_id: { type: integer, nullable: true }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /imports/journal-entries:
    post:
      tags: [Files]
      operationId: importJournalEntries
      summary: Import journal entries from a CSV file in the CSV directory
      description: |
        The whole file is imported in **one database transaction**: if any
        entry is invalid, nothing is imported and every problem is reported
        with its row number. A file whose exact content (SHA-256) was imported
        before is refused with 409, so the same file can't be posted twice.

        Format: UTF-8 (a leading BOM is tolerated), comma separated, header
        row required, column names case-insensitive and in any order, at most
        10 MiB and 50,000 rows.

        | column         | required | notes |
        |----------------|----------|-------|
        | `entry_key`    | yes | Rows with the same key form one journal entry; they must be contiguous |
        | `entry_date`   | yes | `YYYY-MM-DD`; may be blank on later rows of an entry |
        | `description`  | yes | May be blank on later rows of an entry |
        | `account_code` | yes | Existing, active account |
        | `debit`        | yes | Decimal, max two decimals (`1234.56`), no signs/separators; blank = 0 |
        | `credit`       | yes | Same as debit; exactly one of debit/credit is non-zero |
        | `reference`    | no  | May be blank on later rows of an entry |
        | `memo`         | no  | Per line |
        | `currency`     | no  | `CAD`/`USD`; if given, must match the account's currency |

        Example:
        ```
        entry_key,entry_date,description,account_code,debit,credit
        S1,2026-10-01,Cash sale,1000,250.00,
        S1,,,4000,,250.00
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRequest' }
      responses:
        '201':
          description: All entries imported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /backups:
    get:
      tags: [System]
      operationId: getBackups
      summary: The current organization's backup settings, last run and newest backups on the share
      responses:
        '200':
          description: Backups
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupInfo' }
        default: { $ref: '#/components/responses/Error' }

  /backups/config:
    put:
      tags: [System]
      operationId: putBackupConfig
      summary: Save backup settings
      description: |
        `google.client_secret` omitted or null keeps the saved secret.
        Changing the client ID disconnects the Google account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackupConfigChange' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupInfo' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /backups/run:
    post:
      tags: [System]
      operationId: runBackup
      summary: Back up now (runs in the background)
      responses:
        '202':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupInfo' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /backups/restorable:
    get:
      tags: [System]
      operationId: listRestorableBackups
      summary: Backups on the destinations that can be restored
      responses:
        '200':
          description: Backups, newest first per destination
          content:
            application/json:
              schema:
                type: object
                required: [backups, settings, problems, confirm]
                properties:
                  backups: { type: array, description: Backups of the books (ledger-…), items: { $ref: '#/components/schemas/RestorableBackup' } }
                  settings: { type: array, description: Backups of the settings (settings-…), items: { $ref: '#/components/schemas/RestorableBackup' } }
                  problems: { type: array, items: { type: string }, description: Destinations that could not be listed }
                  confirm: { type: string, description: What the user must type to confirm a restore }
        default: { $ref: '#/components/responses/Error' }

  /backups/restore:
    post:
      tags: [System]
      operationId: restoreBackup
      summary: Replace the current organization's books with a backup's
      description: >
        Runs in the background: backs up the organization's current books,
        fetches and checks the chosen backup, then the server stops for a
        moment while the organization's database and module files are replaced
        by the backup's. Users, passwords, sign-ins, other organizations and
        this organization's settings are not touched. If anything fails,
        nothing is changed. Progress is in `restore` of GET /backups.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, confirm]
              properties:
                source: { type: string, enum: [share, google, upload], description: 'upload: the dump file uploaded with /backups/restore/upload' }
                backup: { type: string, description: The backup's folder (not needed for upload) }
                confirm: { type: string }
      responses:
        '202':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupInfo' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /backups/restore/upload:
    post:
      tags: [System]
      operationId: uploadRestoreDumpPiece
      summary: Upload a piece of a dump file to restore from
      description: Send the file in order, in pieces of at most 8 MiB (offset 0 starts over), then call /backups/restore/upload/finish.
      parameters:
        - { name: offset, in: query, required: true, schema: { type: integer, minimum: 0 }, description: Where this piece starts in the file }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema: { type: object, required: [size_bytes], properties: { size_bytes: { type: integer, description: Bytes received so far } } }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [System]
      operationId: deleteRestoreUpload
      summary: Discard the uploaded dump file
      responses:
        '200':
          description: Discarded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupInfo' }
        default: { $ref: '#/components/responses/Error' }

  /backups/restore/upload/finish:
    post:
      tags: [System]
      operationId: finishRestoreUpload
      summary: Check the uploaded dump file and make it ready to restore
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { filename: { type: string } } }
      responses:
        '200':
          description: Ready (see `upload`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupInfo' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /backups/restore-settings:
    post:
      tags: [System]
      operationId: restoreBackupSettings
      summary: Put back the current organization's settings from a settings backup
      description: Modules' settings become what the file holds; the backup schedule and retention too (destinations are not in the file). The books are not touched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, backup]
              properties:
                source: { type: string, enum: [share, google] }
                backup: { type: string, description: A settings backup's folder (settings-…) }
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BackupInfo'
                  - type: object
                    required: [settings_restored]
                    properties:
                      settings_restored:
                        type: object
                        required: [backup, made_at, modules]
                        properties:
                          backup: { type: string }
                          made_at: { type: string }
                          modules: { type: array, items: { type: string } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /backups/share/test:
    post:
      tags: [System]
      operationId: testBackupShare
      summary: Check that the network share (as filled in, not saved yet) can be written to
      description: Without password, the saved one is used (same server and user).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareTargetChange' }
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                required: [ok, message, free_bytes]
                properties:
                  ok: { type: boolean }
                  message: { type: string }
                  free_bytes: { type: integer, nullable: true }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /backups/google/connect:
    post:
      tags: [System]
      operationId: connectGoogle
      summary: Start connecting Google Drive (OAuth device flow)
      description: Show the user `user_code` and `verification_url`, then call /backups/google/poll every `interval` seconds.
      responses:
        '200':
          description: Code for the user
          content:
            application/json:
              schema:
                type: object
                required: [user_code, verification_url, expires_at, interval]
                properties:
                  user_code: { type: string }
                  verification_url: { type: string }
                  expires_at: { type: string, format: date-time }
                  interval: { type: integer }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /backups/google/poll:
    post:
      tags: [System]
      operationId: pollGoogle
      summary: Whether the user has approved access yet
      responses:
        '200':
          description: State
          content:
            application/json:
              schema:
                type: object
                required: [state, account]
                properties:
                  state: { type: string, enum: [pending, connected, denied, expired] }
                  account: { type: string }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /backups/google/disconnect:
    post:
      tags: [System]
      operationId: disconnectGoogle
      summary: Disconnect Google Drive (revokes Ledger's access)
      responses:
        '200':
          description: Disconnected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupInfo' }
        default: { $ref: '#/components/responses/Error' }

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Users (admins of the main books see everyone; an organization's admin sees that organization's members)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/UserListItem' } } } }
        '403': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Users]
      operationId: createUser
      summary: Add a user (an organization's admin can add them to that organization only)
      description: |
        `organization` chooses their books: the main books (the default; role
        is their role there), an existing organization, or a new
        organization of their own (business or personal books, optionally
        with a starter chart of accounts). Outside the main books, role is
        their role in that organization and they get no access to the main
        books.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password, role]
              properties:
                username: { type: string }
                password: { type: string, minLength: 4 }
                role: { $ref: '#/components/schemas/MainRole' }
                organization:
                  type: object
                  additionalProperties: false
                  required: [mode]
                  properties:
                    mode: { type: string, enum: [main, existing, new] }
                    organization_id: { type: integer, description: 'mode "existing"' }
                    name: { type: string, description: 'mode "new"' }
                    kind: { $ref: '#/components/schemas/OrgKind' }
                    chart: { allOf: [{ $ref: '#/components/schemas/Currency' }], nullable: true, description: 'mode "new": start with a basic chart of accounts in this currency' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListItem' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /users/{username}:
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Change a user's role in the main books (main-books admins), disable or enable them, or reset their password
      description: |
        At least one active admin must remain, and admins can't disable
        themselves. Disabling or a new password ends the user's sessions.
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role: { $ref: '#/components/schemas/MainRole' }
                is_active: { type: boolean }
                password: { type: string, minLength: 4 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListItem' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /users/{username}/organizations/{orgId}:
    parameters:
      - { name: username, in: path, required: true, schema: { type: string } }
      - { name: orgId, in: path, required: true, schema: { type: integer } }
    put:
      tags: [Users]
      operationId: setMembership
      summary: Give a user a role in an organization other than the main books (main-books admins; an organization's admin for their own)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListItem' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Users]
      operationId: removeMembership
      summary: Take a user's access to an organization away (main-books admins; an organization's admin for their own)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListItem' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /entities:
    get:
      tags: [Entities]
      operationId: listEntities
      summary: Customers and vendors (one list shared with modules), by name
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [customer, vendor] }, description: Only customers or only vendors (an entity that is both matches either) }
        - { name: q, in: query, schema: { type: string }, description: Part of the name }
        - { name: include_inactive, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Entities
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/Entity' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Entities]
      operationId: createEntity
      summary: Add a customer, a vendor, or one that is both
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntityInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entity' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /entities/{entityId}:
    parameters:
      - { name: entityId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Entities]
      operationId: getEntity
      summary: One entity
      responses:
        '200':
          description: The entity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entity' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Entities]
      operationId: updateEntity
      summary: Change an entity (entities are made inactive, never deleted)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntityInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entity' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /search:
    get:
      tags: [Reports]
      operationId: search
      summary: Search accounts, journal entries (text, number or amount) and modules
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 25, default: 8 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResults' }
        default: { $ref: '#/components/responses/Error' }

  /integrations/llm:
    get:
      tags: [Integrations]
      operationId: getLlm
      summary: The LLM API connections shared with modules, and their usage (admin)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LlmInfo' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [Integrations]
      operationId: putLlm
      summary: Set the LLM API connections and the modules allowed to use them (admin)
      description: |
        `connections` replaces the list. A connection's `api_key` omitted or
        null keeps the saved key of the connection with the same id; "" clears
        it. Requests with images or documents go to the first connection whose
        `uses` has "images", the rest to the first with "text", unless a
        module names a connection id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                connections:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, name, provider]
                    properties:
                      id: { type: string, pattern: '^[a-z][a-z0-9-]{0,31}$' }
                      name: { type: string }
                      provider: { type: string, enum: [anthropic, ollama, openai] }
                      model: { type: string }
                      base_url: { type: string }
                      api_key: { type: string, nullable: true }
                      effort: { type: string, enum: [low, medium, high] }
                      max_tokens: { type: integer }
                      uses: { type: array, items: { type: string, enum: [text, images] } }
                allow_modules: { type: array, items: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LlmInfo' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /integrations/llm/test:
    post:
      tags: [Integrations]
      operationId: testLlm
      summary: Send a tiny prompt to check a connection works (admin; the one for text by default)
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { connection: { type: string } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [text, model, duration_ms], properties: { text: { type: string }, model: { type: string }, duration_ms: { type: integer } } }
        default: { $ref: '#/components/responses/Error' }

  /integrations/gmail:
    get:
      tags: [Integrations]
      operationId: getGmail
      summary: Gmail connection shared with modules (admin)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GmailInfo' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [Integrations]
      operationId: putGmail
      summary: Set the OAuth client and which modules may read and send (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id: { type: string }
                client_secret: { type: string, nullable: true }
                allow_read: { type: array, items: { type: string } }
                allow_send: { type: array, items: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GmailInfo' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /integrations/gmail/start:
    post:
      tags: [Integrations]
      operationId: startGmail
      summary: Start connecting Gmail; open auth_url, approve, then paste the address the browser lands on into /finish
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { send: { type: boolean, description: Also ask permission to send mail } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [auth_url, redirect_uri], properties: { auth_url: { type: string }, redirect_uri: { type: string } } }
        default: { $ref: '#/components/responses/Error' }

  /integrations/gmail/finish:
    post:
      tags: [Integrations]
      operationId: finishGmail
      summary: Finish connecting with the pasted address (or code)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [url], properties: { url: { type: string } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GmailInfo' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /integrations/gmail/disconnect:
    post:
      tags: [Integrations]
      operationId: disconnectGmail
      summary: Disconnect Gmail (revokes Ledger's access)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GmailInfo' }
        default: { $ref: '#/components/responses/Error' }

  /system/update:
    get:
      tags: [System]
      operationId: getUpdate
      summary: Installed version, update schedule and the updater's last result
      responses:
        '200':
          description: Update information
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateInfo' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /system/update/schedule:
    put:
      tags: [System]
      operationId: setUpdateSchedule
      summary: Set when updates are installed and whether the container reboots
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSchedule' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateInfo' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /system/update/repo:
    put:
      tags: [System]
      operationId: putUpdateRepo
      summary: Follow Ledger's repository to its new name (after a rename or transfer on GitHub)
      description: |
        Only the same GitHub repository (same repository id) is accepted, since
        the root updater installs from it. GitHub's current spelling is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModuleRepo' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateInfo' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /system/update/check:
    post:
      tags: [System]
      operationId: checkForUpdate
      summary: Check GitHub now and install a newer release if there is one
      description: |
        Queues a run of the updater (it starts within seconds). It reboots
        only if it installed a release and the schedule's reboot policy is
        not `never`. Poll `GET /system/update` for progress.
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateInfo' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /modules:
    get:
      tags: [Modules]
      operationId: listModules
      summary: Installed and wanted modules, and sidebar entries
      responses:
        '200':
          description: Modules
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModulesInfo' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Modules]
      operationId: addModule
      summary: Add a module from a GitHub repository (installed within seconds)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModuleRepo' }
      responses:
        '202':
          description: Queued for installation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModulesInfo' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /modules/preview:
    post:
      tags: [Modules]
      operationId: previewModule
      summary: Read a repository's module manifest from its latest release, without installing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModuleRepo' }
      responses:
        '200':
          description: The module that would be installed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModulePreview' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /modules/sync:
    post:
      tags: [Modules]
      operationId: syncModules
      summary: Update all modules to their latest releases now
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModulesInfo' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /modules/{moduleId}/import:
    parameters:
      - { name: moduleId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Modules]
      operationId: getModuleImport
      summary: What the module's "Import from CSV" takes (ctx.imports)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleImportInfo' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [Modules]
      operationId: uploadModuleImport
      summary: Upload a CSV for the module; columns are matched to its fields (AI or names)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                use_ai: { type: string, enum: ['true', 'false'] }
      responses:
        '201':
          description: The proposed mapping and converted rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleImportPlan' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /modules/{moduleId}/import/{uploadId}/preview:
    parameters:
      - { name: moduleId, in: path, required: true, schema: { type: string } }
      - { name: uploadId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Modules]
      operationId: previewModuleImport
      summary: The rows with a changed mapping, checked by the module (a dry run)
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { mapping: { $ref: '#/components/schemas/ModuleImportMapping' } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleImportPlan' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /modules/{moduleId}/import/{uploadId}/run:
    parameters:
      - { name: moduleId, in: path, required: true, schema: { type: string } }
      - { name: uploadId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Modules]
      operationId: runModuleImport
      summary: Hand the rows to the module (only if its check found no problems)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { mapping: { $ref: '#/components/schemas/ModuleImportMapping' } } }
      responses:
        '200':
          description: Imported
          content:
            application/json:
              schema:
                type: object
                required: [imported, skipped, summary, errors]
                properties:
                  imported: { type: integer }
                  skipped: { type: integer, description: Rows left out because a value couldn't be read }
                  summary: { type: string }
                  errors: { type: array, items: { $ref: '#/components/schemas/ModuleImportProblem' } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /modules/{moduleId}/storage/{path}:
    get:
      tags: [Modules]
      operationId: getModuleStoredFile
      summary: A file the module keeps (ctx.storage); PDFs, pictures and text open inline, the rest downloads
      parameters:
        - { name: moduleId, in: path, required: true, schema: { type: string } }
        - { name: path, in: path, required: true, schema: { type: string }, description: 'May contain slashes: folders/file.pdf' }
      responses:
        '200': { description: The file, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/Error' }

  /modules/{moduleId}/settings:
    get:
      tags: [Modules]
      operationId: getModuleSettings
      summary: A running module's declared settings and their values
      description: Secret fields are never returned; `secrets_set` says whether each one has a value.
      parameters:
        - { name: moduleId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleSettings' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [Modules]
      operationId: putModuleSettings
      summary: Save a module's settings
      description: |
        Keys left out keep their value; null resets a field to its default.
        For secret fields, null or leaving the key out keeps the stored value
        and "" clears it.
      parameters:
        - { name: moduleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties: { $ref: '#/components/schemas/SettingValue' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleSettings' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /modules/{moduleId}:
    delete:
      tags: [Modules]
      operationId: removeModule
      summary: Remove a module (its data is kept)
      parameters:
        - name: moduleId
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,31}$' }
      responses:
        '202':
          description: Queued for removal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModulesInfo' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Modules]
      operationId: renameModuleRepo
      summary: Point a module at its repository's new name (after a rename on GitHub)
      description: The repository's latest release must hold the same module (same manifest id).
      parameters:
        - name: moduleId
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,31}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModuleRepo' }
      responses:
        '202':
          description: Saved; the installer records the new name at its next sync
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModulesInfo' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ledger_session

  parameters:
    AccountCode:
      name: accountCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/AccountCode' }
    ReconciliationId:
      name: reconciliationId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    EntryId:
      name: entryId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Filename:
      name: filename
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CsvFilename' }
    From:
      name: from
      in: query
      description: Inclusive start date
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      description: Inclusive end date
      schema: { type: string, format: date }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Cents:
      description: Non-negative amount in cents.
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
    SignedCents:
      description: Signed amount in cents (positive = debit balance, negative = credit balance).
      type: integer
      format: int64
      minimum: -9007199254740991
      maximum: 9007199254740991
    AccountType:
      type: string
      enum: [asset, liability, equity, revenue, expense]
    AccountCode:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$'
      example: '1000'
    Currency:
      type: string
      enum: [CAD, USD]
    CurrencyInfo:
      type: object
      required: [code, name, minor_units]
      properties:
        code: { $ref: '#/components/schemas/Currency' }
        name: { type: string, example: Canadian dollar }
        minor_units: { type: integer, enum: [2] }
    CurrencyTotal:
      type: object
      required: [currency, amount_cents]
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        amount_cents: { $ref: '#/components/schemas/Cents' }
    CsvFilename:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}\.csv$'

    User:
      type: object
      required: [username, role, is_active, created_at, last_login_at, server_admin]
      properties:
        username: { type: string, example: alice }
        role: { allOf: [{ $ref: '#/components/schemas/Role' }], description: Their role in the organization this session works in }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true }
        server_admin: { type: boolean, description: 'An admin of the main books: manages users, organizations, modules, updates, backups and integrations' }
    CurrentUser:
      allOf:
        - { $ref: '#/components/schemas/User' }
        - type: object
          required: [organization, organizations]
          properties:
            organization:
              type: object
              required: [id, name, kind]
              properties:
                id: { type: integer }
                name: { type: string }
                kind: { $ref: '#/components/schemas/OrgKind' }
            organizations: { type: array, items: { $ref: '#/components/schemas/OrgAccess' } }
    UserListItem:
      type: object
      required: [username, role, is_active, created_at, last_login_at, server_admin, organizations, manageable]
      properties:
        manageable: { type: boolean, description: Whether the caller may reset this user's password and disable or enable them (an organization's admin may only when the user has access to nothing else) }
        username: { type: string }
        role: { allOf: [{ $ref: '#/components/schemas/MainRole' }], description: Their role in the main books }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true }
        server_admin: { type: boolean }
        organizations: { type: array, items: { $ref: '#/components/schemas/OrgAccess' }, description: Organizations other than the main books }
    OrgKind:
      type: string
      enum: [business, personal]
    OrgAccess:
      type: object
      required: [id, name, kind, status, role]
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { $ref: '#/components/schemas/OrgKind' }
        status: { type: string, enum: [pending, ready, error] }
        role: { $ref: '#/components/schemas/Role' }
    Organization:
      type: object
      required: [id, name, kind, status, message, created_at]
      properties:
        id: { type: integer, description: '1 is the main books' }
        name: { type: string }
        kind: { $ref: '#/components/schemas/OrgKind' }
        status: { type: string, enum: [pending, ready, error], description: 'pending while its database is being created' }
        message: { type: string, description: Why creating it failed }
        created_at: { type: string, format: date-time }
    OrganizationCreate:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { $ref: '#/components/schemas/OrgKind' }
        chart: { allOf: [{ $ref: '#/components/schemas/Currency' }], nullable: true, description: Start with a basic chart of accounts in this currency }
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, description: Case-insensitive }
        password: { type: string, format: password }
    PasswordChange:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 4, description: '4+ characters (a 4-digit PIN is allowed), at most 72 bytes' }

    ReportLine:
      type: object
      required: [account_code, account_name, amount_cents, depth, parent_code, has_children, total_cents]
      description: Lines come as a tree, a parent account first and then its sub-accounts.
      properties:
        account_code: { $ref: '#/components/schemas/AccountCode' }
        account_name: { type: string }
        amount_cents:
          allOf: [{ $ref: '#/components/schemas/SignedCents' }]
          description: Natural-sign balance of the account's own postings (a contra balance is negative)
        depth: { type: integer, description: '0 for a top-level account, 1 for its sub-accounts, and so on' }
        parent_code: { type: string, nullable: true }
        has_children: { type: boolean, description: Whether sub-account lines follow this one }
        total_cents:
          allOf: [{ $ref: '#/components/schemas/SignedCents' }]
          description: amount_cents plus every sub-account line below it
    BalanceSheet:
      type: object
      required: [as_of, currencies]
      properties:
        as_of: { type: string, format: date }
        currencies:
          type: array
          items:
            type: object
            required: [currency, assets, liabilities, equity, net_income_cents, total_assets_cents,
                       total_liabilities_cents, total_equity_cents, balanced]
            properties:
              currency: { $ref: '#/components/schemas/Currency' }
              assets: { type: array, items: { $ref: '#/components/schemas/ReportLine' } }
              liabilities: { type: array, items: { $ref: '#/components/schemas/ReportLine' } }
              equity: { type: array, items: { $ref: '#/components/schemas/ReportLine' } }
              net_income_cents:
                allOf: [{ $ref: '#/components/schemas/SignedCents' }]
                description: Revenue minus expenses to date, not yet closed to equity
              total_assets_cents: { $ref: '#/components/schemas/SignedCents' }
              total_liabilities_cents: { $ref: '#/components/schemas/SignedCents' }
              total_equity_cents:
                allOf: [{ $ref: '#/components/schemas/SignedCents' }]
                description: Equity accounts plus net income
              balanced: { type: boolean, description: assets = liabilities + equity }
    IncomeStatement:
      type: object
      required: [from, to, currencies]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        currencies:
          type: array
          items:
            type: object
            required: [currency, revenue, expenses, total_revenue_cents, total_expenses_cents, net_income_cents]
            properties:
              currency: { $ref: '#/components/schemas/Currency' }
              revenue: { type: array, items: { $ref: '#/components/schemas/ReportLine' } }
              expenses: { type: array, items: { $ref: '#/components/schemas/ReportLine' } }
              total_revenue_cents: { $ref: '#/components/schemas/SignedCents' }
              total_expenses_cents: { $ref: '#/components/schemas/SignedCents' }
              net_income_cents: { $ref: '#/components/schemas/SignedCents' }

    Health:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [ok, unreachable] }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code
              enum:
                - bad_request
                - validation_failed
                - not_found
                - conflict
                - unauthorized
                - forbidden
                - payload_too_large
                - too_many_requests
                - internal_error
            message: { type: string }
            details:
              type: array
              items:
                type: object
                required: [message]
                properties:
                  field:
                    type: string
                    description: |
                      Offending field, e.g. `lines[1].debit_cents` (JSON) or
                      `row 7.account_code` (CSV import)
                  message: { type: string }

    Account:
      type: object
      required: [code, name, type, currency, description, is_active, balance_cents, kind, parent_code, total_balance_cents, created_at, updated_at]
      properties:
        kind: { allOf: [{ $ref: '#/components/schemas/AccountKind' }], nullable: true }
        parent_code: { type: string, nullable: true, description: 'The account this one sits under (same type and currency), or null' }
        total_balance_cents:
          allOf: [{ $ref: '#/components/schemas/SignedCents' }]
          description: balance_cents plus the balances of every sub-account below it
        code: { $ref: '#/components/schemas/AccountCode' }
        name: { type: string }
        type: { $ref: '#/components/schemas/AccountType' }
        currency: { $ref: '#/components/schemas/Currency' }
        description: { type: string }
        is_active: { type: boolean }
        balance_cents:
          allOf: [{ $ref: '#/components/schemas/SignedCents' }]
          description: Current balance in the account's currency (debit-positive)
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AccountCreate:
      type: object
      required: [code, name, type, currency]
      additionalProperties: false
      properties:
        code: { $ref: '#/components/schemas/AccountCode' }
        name: { type: string, minLength: 1, maxLength: 200, example: Bank CAD }
        type: { $ref: '#/components/schemas/AccountType' }
        currency: { $ref: '#/components/schemas/Currency' }
        description: { type: string, maxLength: 1000, default: '' }
        parent_code: { type: string, nullable: true, description: 'Make it a sub-account of this account (same type and currency, at most 5 levels deep)' }
        kind: { allOf: [{ $ref: '#/components/schemas/AccountKind' }], nullable: true }
    AccountUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        is_active: { type: boolean }
        parent_code: { type: string, nullable: true, description: 'Move it under this account (same type and currency); null makes it top-level' }
        kind: { allOf: [{ $ref: '#/components/schemas/AccountKind' }], nullable: true, description: null removes the tag }

    JournalLineCreate:
      type: object
      required: [account_code, debit_cents, credit_cents]
      additionalProperties: false
      description: |
        Exactly one of debit_cents / credit_cents must be > 0. The amount is
        in the account's currency.
      properties:
        account_code: { $ref: '#/components/schemas/AccountCode' }
        debit_cents: { $ref: '#/components/schemas/Cents' }
        credit_cents: { $ref: '#/components/schemas/Cents' }
        memo: { type: string, maxLength: 500, default: '' }
    Entity:
      type: object
      description: A person or business the books deal with; a customer, a vendor, or both.
      required: [id, name, is_customer, is_vendor, email, phone, address, notes, is_active, created_at, updated_at]
      properties:
        id: { type: integer }
        name: { type: string }
        is_customer: { type: boolean }
        is_vendor: { type: boolean }
        email: { type: string }
        phone: { type: string }
        address: { type: string }
        notes: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EntityInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        is_customer: { type: boolean }
        is_vendor: { type: boolean }
        email: { type: string, maxLength: 200 }
        phone: { type: string, maxLength: 100 }
        address: { type: string, maxLength: 1000 }
        notes: { type: string, maxLength: 2000 }
        is_active: { type: boolean }
    AccountKind:
      type: string
      enum: [chequing, savings, credit_card]
      description: What a bank-type account is. chequing and savings are asset accounts, credit_card a liability.
    JournalEntryCreate:
      type: object
      required: [entry_date, description, lines]
      additionalProperties: false
      properties:
        entity_id: { type: integer, nullable: true, description: The vendor or customer the entry is with }
        entry_date: { type: string, format: date }
        description: { type: string, minLength: 1, maxLength: 500 }
        reference: { type: string, maxLength: 100, default: '' }
        lines:
          type: array
          minItems: 2
          maxItems: 1000
          items: { $ref: '#/components/schemas/JournalLineCreate' }

    JournalLine:
      type: object
      required: [id, line_number, account_code, account_name, currency, debit_cents, credit_cents, memo]
      properties:
        id: { type: integer, format: int64 }
        line_number: { type: integer }
        account_code: { $ref: '#/components/schemas/AccountCode' }
        account_name: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        debit_cents: { $ref: '#/components/schemas/Cents' }
        credit_cents: { $ref: '#/components/schemas/Cents' }
        memo: { type: string }
    JournalEntry:
      type: object
      required: [id, entry_date, description, reference, reverses_id, reversed_by_id, import_id, created_by, entity, posted_at, totals, lines, links]
      properties:
        entity:
          type: object
          nullable: true
          description: The vendor or customer the entry is with
          required: [id, name]
          properties:
            id: { type: integer }
            name: { type: string }
        id: { type: integer, format: int64 }
        entry_date: { type: string, format: date }
        description: { type: string }
        reference: { type: string }
        reverses_id:
          type: integer
          format: int64
          nullable: true
          description: Set when this entry reverses another entry
        reversed_by_id:
          type: integer
          format: int64
          nullable: true
          description: Set when another entry reverses this one
        import_id:
          type: integer
          format: int64
          nullable: true
          description: Set when the entry was created by a CSV import
        created_by:
          type: string
          nullable: true
          description: Username of the person who posted the entry
        posted_at: { type: string, format: date-time }
        totals:
          type: array
          description: Per-currency sum of debits (always equal to the sum of credits), ordered by currency
          items: { $ref: '#/components/schemas/CurrencyTotal' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/JournalLine' }
        links:
          type: array
          description: Module records linked to this entry (an invoice, a bank transaction, a bill)
          items: { $ref: '#/components/schemas/EntryLink' }
    EntryLink:
      type: object
      required: [module_id, ref, label, href, created_at]
      properties:
        module_id: { type: string, example: sales }
        ref: { type: string, description: "The module's key for the record", example: 'invoice:31' }
        label: { type: string, example: 'Invoice 31 · Acme' }
        href: { type: string, description: "Where it opens in Ledger ('' for nowhere)", example: '/apps/sales?invoice=31' }
        created_at: { type: string, format: date-time }
    ReverseRequest:
      type: object
      additionalProperties: false
      properties:
        entry_date:
          type: string
          format: date
          description: Date of the reversing entry (default today)
        description:
          type: string
          maxLength: 500
          description: Default "Reversal of entry #<id>"

    AccountLedger:
      type: object
      required: [account, opening_balance_cents, closing_balance_cents, lines]
      properties:
        account: { $ref: '#/components/schemas/Account' }
        opening_balance_cents: { $ref: '#/components/schemas/SignedCents' }
        closing_balance_cents: { $ref: '#/components/schemas/SignedCents' }
        lines:
          type: array
          items:
            type: object
            required: [journal_entry_id, line_id, entry_date, description, memo, debit_cents, credit_cents, running_balance_cents]
            properties:
              journal_entry_id: { type: integer, format: int64 }
              line_id: { type: integer, format: int64 }
              entry_date: { type: string, format: date }
              description: { type: string }
              reference: { type: string }
              memo: { type: string }
              debit_cents: { $ref: '#/components/schemas/Cents' }
              credit_cents: { $ref: '#/components/schemas/Cents' }
              running_balance_cents: { $ref: '#/components/schemas/SignedCents' }

    TrialBalance:
      type: object
      required: [as_of, rows, totals]
      properties:
        as_of: { type: string, format: date }
        rows:
          type: array
          description: Ordered by currency, then account code
          items:
            type: object
            required: [account_code, account_name, account_type, currency, debit_cents, credit_cents]
            properties:
              account_code: { $ref: '#/components/schemas/AccountCode' }
              account_name: { type: string }
              account_type: { $ref: '#/components/schemas/AccountType' }
              currency: { $ref: '#/components/schemas/Currency' }
              debit_cents: { $ref: '#/components/schemas/Cents' }
              credit_cents: { $ref: '#/components/schemas/Cents' }
        totals:
          type: array
          description: One row per currency; debits always equal credits
          items:
            type: object
            required: [currency, debit_cents, credit_cents]
            properties:
              currency: { $ref: '#/components/schemas/Currency' }
              debit_cents: { $ref: '#/components/schemas/Cents' }
              credit_cents: { $ref: '#/components/schemas/Cents' }

    ExportRequest:
      type: object
      additionalProperties: false
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        currency:
          allOf: [{ $ref: '#/components/schemas/Currency' }]
          description: Only accounts in this currency (default all)
    CsvFile:
      type: object
      required: [filename, size_bytes, modified_at]
      properties:
        filename: { $ref: '#/components/schemas/CsvFilename' }
        size_bytes: { type: integer, format: int64 }
        modified_at: { type: string, format: date-time }
        row_count:
          type: integer
          description: Data rows written (export responses only)

    ImportRequest:
      type: object
      required: [filename]
      additionalProperties: false
      properties:
        filename: { $ref: '#/components/schemas/CsvFilename' }
    MigrationKind:
      type: string
      enum: [accounts, general_ledger, trial_balance, customers, vendors]
    MigrationAccountChoice:
      type: object
      properties:
        action: { type: string, enum: [create, map, skip] }
        code: { type: string }
        name: { type: string }
        type: { $ref: '#/components/schemas/AccountType' }
        currency: { $ref: '#/components/schemas/Currency' }
    MigrationMapping:
      type: object
      required: [kind, columns, header_row, account_from_sections, date_format, decimal_comma, currency, as_of, accounts]
      properties:
        kind: { $ref: '#/components/schemas/MigrationKind' }
        columns: { type: object, additionalProperties: { type: string, nullable: true }, description: "Ledger field → the file's column" }
        header_row: { type: integer }
        account_from_sections: { type: boolean, description: Accounts are heading rows with their lines below }
        date_format: { type: string, enum: [ymd, mdy, dmy] }
        decimal_comma: { type: boolean }
        currency: { $ref: '#/components/schemas/Currency' }
        as_of: { type: string, format: date, description: 'trial_balance: date of the opening entry' }
        accounts: { type: object, additionalProperties: { $ref: '#/components/schemas/MigrationAccountChoice' } }
    MigrationMappingChange:
      type: object
      properties:
        kind: { $ref: '#/components/schemas/MigrationKind' }
        columns: { type: object, additionalProperties: { type: string, nullable: true } }
        header_row: { type: integer }
        account_from_sections: { type: boolean }
        date_format: { type: string, enum: [ymd, mdy, dmy] }
        decimal_comma: { type: boolean }
        currency: { $ref: '#/components/schemas/Currency' }
        as_of: { type: string }
        accounts: { type: object, additionalProperties: { $ref: '#/components/schemas/MigrationAccountChoice' } }
    MigrationPlan:
      type: object
      required: [id, filename, detection, mapping, headers, sample, row_count, fields, required, accounts, entries, contacts, issues, ai_available]
      properties:
        id: { type: string }
        filename: { type: string }
        detection:
          type: object
          required: [kind, confidence, summary, software, source, note]
          properties:
            kind: { $ref: '#/components/schemas/MigrationKind' }
            confidence: { type: number }
            summary: { type: string }
            software: { type: string }
            source: { type: string, enum: [ai, rules] }
            note: { type: string }
        mapping: { $ref: '#/components/schemas/MigrationMapping' }
        headers: { type: array, items: { type: string } }
        sample: { type: array, items: { type: array, items: { type: string } } }
        row_count: { type: integer }
        fields: { type: array, items: { type: string } }
        required: { type: array, items: { type: string } }
        accounts:
          type: array
          items:
            type: object
            required: [label, rows, exists, from, action, code, name, type, currency]
            properties:
              label: { type: string }
              rows: { type: integer }
              exists: { type: boolean }
              from: { type: string, enum: [file, ledger, ai, guess, you] }
              action: { type: string, enum: [create, map, skip] }
              code: { type: string }
              name: { type: string }
              type: { $ref: '#/components/schemas/AccountType' }
              currency: { $ref: '#/components/schemas/Currency' }
        entries:
          type: object
          required: [count, lines, from, to, preview]
          properties:
            count: { type: integer }
            lines: { type: integer }
            from: { type: string, nullable: true }
            to: { type: string, nullable: true }
            preview:
              type: array
              items:
                type: object
                required: [date, description, reference, lines]
                properties:
                  date: { type: string }
                  description: { type: string }
                  reference: { type: string }
                  lines: { type: array, items: { $ref: '#/components/schemas/JournalLineCreate' } }
        contacts:
          type: object
          required: [count, recipients]
          properties:
            count: { type: integer }
            recipients: { type: array, items: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string } } } }
        issues:
          type: array
          items: { type: object, required: [level, message], properties: { level: { type: string, enum: [error, warning] }, message: { type: string } } }
        ai_available: { type: boolean }
    ImportResult:
      type: object
      required: [import_id, filename, sha256, entries_imported, lines_imported]
      properties:
        import_id: { type: integer, format: int64 }
        filename: { type: string }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        entries_imported: { type: integer }
        lines_imported: { type: integer }

    UpdateSchedule:
      type: object
      additionalProperties: false
      required: [enabled, days, time, timezone, reboot]
      properties:
        enabled: { type: boolean, description: Whether scheduled runs happen }
        days:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items: { type: integer, minimum: 0, maximum: 6 }
          description: Days of the week, 0 = Sunday ... 6 = Saturday
        time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '03:30', description: 24-hour local time }
        timezone: { type: string, example: America/Winnipeg, description: IANA time zone for days and time }
        reboot:
          type: string
          enum: [never, after_update, always]
          description: |
            When a scheduled run reboots the container: never, only after
            installing a release, or always (even when already up to date).
        on_startup:
          type: boolean
          default: false
          description: |
            Also check for updates (Ledger, then modules) once each time the
            container starts, about a minute after boot, like "Check for
            updates now"; works with the schedule turned off.
    UpdateStatus:
      type: object
      required: [state, trigger, message, started_at, finished_at, latest_version, installed_version, last_scheduled_for]
      properties:
        state: { type: string, enum: [idle, running, ok, error] }
        trigger: { type: string, enum: [scheduled, manual, startup], nullable: true }
        message: { type: string }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        latest_version: { type: string, nullable: true, description: Latest release on GitHub at the last check }
        installed_version: { type: string, nullable: true, description: Set when the last run installed a release }
        last_scheduled_for: { type: string, format: date-time, nullable: true }
    UpdateInfo:
      type: object
      required: [current_version, updater_installed, repo, schedule, next_run_at, status]
      properties:
        current_version: { type: string, example: v0.6.0 }
        repo:
          type: object
          required: [current, installed]
          description: Where updates come from; current differs from installed after a rename saved in the app
          properties:
            current: { type: string, example: mastifdogo/Bookeeping }
            installed: { type: string, description: LEDGER_UPDATE_REPO, or the default }
        updater_installed: { type: boolean, description: False when the server was not installed from a release }
        schedule: { $ref: '#/components/schemas/UpdateSchedule' }
        next_run_at: { type: string, format: date-time, nullable: true }
        status:
          type: object
          allOf: [{ $ref: '#/components/schemas/UpdateStatus' }]
          nullable: true
          description: Null until the updater has run once
    ModuleRepo:
      type: object
      additionalProperties: false
      required: [repo]
      properties:
        repo: { type: string, example: someone/ledger-invoicing, description: 'owner/name or a github.com URL' }
    ModuleManifest:
      type: object
      required: [id, name, version, description, ledger, server, ui, nav, migrations]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9-]{1,31}$' }
        name: { type: string }
        version: { type: string }
        description: { type: string }
        ledger: { type: string, nullable: true, example: '>=0.6.0' }
        server: { type: string, nullable: true }
        ui: { type: string, nullable: true }
        nav:
          type: object
          nullable: true
          required: [label, icon]
          properties:
            label: { type: string }
            icon:
              type: string
              nullable: true
              description: Name of a sidebar icon (see docs/MODULES.md); unknown names show the generic module icon
        migrations: { type: string, nullable: true }
    ModulePreview:
      type: object
      required: [repo, tag, manifest, compatible, ledger_version]
      properties:
        repo: { type: string }
        tag: { type: string }
        manifest: { $ref: '#/components/schemas/ModuleManifest' }
        compatible: { type: boolean }
        ledger_version: { type: string }
    Reconciliation:
      type: object
      required: [id, account_code, account_name, account_type, currency, statement_date, statement_balance_cents, status, created_by, created_at, finished_by, finished_at, cleared_count]
      properties:
        id: { type: integer, format: int64 }
        account_code: { $ref: '#/components/schemas/AccountCode' }
        account_name: { type: string }
        account_type: { $ref: '#/components/schemas/AccountType' }
        currency: { $ref: '#/components/schemas/Currency' }
        statement_date: { type: string, format: date }
        statement_balance_cents: { $ref: '#/components/schemas/SignedCents' }
        status: { type: string, enum: [open, finished] }
        created_by: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        finished_by: { type: string, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        cleared_count: { type: integer }
    ReconciliationLine:
      type: object
      required: [transaction_id, journal_entry_id, entry_date, description, reference, memo, debit_cents, credit_cents, amount_cents, cleared]
      properties:
        transaction_id: { type: integer, format: int64 }
        journal_entry_id: { type: integer, format: int64 }
        entry_date: { type: string, format: date }
        description: { type: string }
        reference: { type: string }
        memo: { type: string }
        debit_cents: { $ref: '#/components/schemas/Cents' }
        credit_cents: { $ref: '#/components/schemas/Cents' }
        amount_cents:
          allOf: [{ $ref: '#/components/schemas/SignedCents' }]
          description: In the account's natural sign
        cleared: { type: boolean }
    ReconciliationDetail:
      type: object
      required: [reconciliation, opening_balance_cents, cleared_balance_cents, difference_cents, lines]
      properties:
        reconciliation: { $ref: '#/components/schemas/Reconciliation' }
        opening_balance_cents:
          allOf: [{ $ref: '#/components/schemas/SignedCents' }]
          description: Cleared on earlier statements
        cleared_balance_cents: { $ref: '#/components/schemas/SignedCents' }
        difference_cents:
          allOf: [{ $ref: '#/components/schemas/SignedCents' }]
          description: Statement balance minus cleared balance; 0 to finish
        lines:
          type: array
          description: Uncleared lines dated on or before the statement, plus the lines cleared on this statement
          items: { $ref: '#/components/schemas/ReconciliationLine' }
    SidebarPrefs:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            type: object
            required: [id, hidden]
            properties:
              id:
                type: string
                description: '"core:<page>" (dashboard, journal, new-entry, accounts, reports, files) or "module:<id>"'
                example: core:journal
              hidden: { type: boolean }
    PeriodSummary:
      type: object
      required: [from, to, revenue_cents, expenses_cents, net_income_cents]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        revenue_cents: { $ref: '#/components/schemas/SignedCents' }
        expenses_cents: { $ref: '#/components/schemas/SignedCents' }
        net_income_cents: { $ref: '#/components/schemas/SignedCents' }
    CurrencySummary:
      type: object
      required: [currency, assets_cents, liabilities_cents, net_worth_cents, month, year, top_expenses]
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        assets_cents: { $ref: '#/components/schemas/SignedCents' }
        liabilities_cents: { $ref: '#/components/schemas/SignedCents' }
        net_worth_cents:
          allOf: [{ $ref: '#/components/schemas/SignedCents' }]
          description: Assets minus liabilities
        month: { $ref: '#/components/schemas/PeriodSummary' }
        year: { $ref: '#/components/schemas/PeriodSummary' }
        top_expenses:
          type: array
          description: Up to five expense accounts, largest first, this month
          items: { $ref: '#/components/schemas/ReportLine' }
    DashboardItem:
      type: object
      required: [id, source, source_name, kind, key, title, body, level, link, due_date, created_at, updated_at, expires_at, closed_at, closed_by]
      properties:
        id: { type: integer, format: int64 }
        source: { type: string, description: 'Module id, or "ledger"' }
        source_name: { type: string }
        kind: { type: string, enum: [notification, todo] }
        key: { type: string, description: The poster's own id for the item }
        title: { type: string }
        body: { type: string }
        level: { type: string, enum: [info, success, warning, danger] }
        link: { type: string, description: 'A path inside Ledger, or ""' }
        due_date: { type: string, format: date, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true, description: Dismissed or done }
        closed_by: { type: string, nullable: true, description: Username, when a person closed it }
    Dashboard:
      type: object
      required: [summary, notifications, todos]
      properties:
        summary:
          type: object
          required: [as_of, currencies]
          properties:
            as_of: { type: string, format: date }
            currencies:
              type: array
              items: { $ref: '#/components/schemas/CurrencySummary' }
        notifications:
          type: array
          items: { $ref: '#/components/schemas/DashboardItem' }
        todos:
          type: array
          items: { $ref: '#/components/schemas/DashboardItem' }
    ModuleInfo:
      type: object
      required: [repo, id, name, version, description, nav_label, has_settings, accepts, state, message]
      properties:
        repo: { type: string, nullable: true }
        id: { type: string, nullable: true }
        name: { type: string }
        version: { type: string, nullable: true }
        description: { type: string }
        nav_label: { type: string, nullable: true }
        has_settings: { type: boolean, description: The module declares settings (it gets a Settings tab) }
        accepts:
          type: array
          description: Kinds of files it takes from other modules (ctx.files)
          items: { type: string, enum: [transaction, receipt, statement, bill] }
        state:
          type: string
          enum: [running, failed, pending, error, removing]
          description: |
            running; failed (installed but would not load: see message);
            pending (waiting for the installer); error (the installer could
            not install it: see message); removing (taken off the list).
        message: { type: string }
    SettingValue:
      nullable: true
      oneOf:
        - { type: string }
        - { type: number }
        - { type: boolean }
    SettingsField:
      type: object
      required: [key, label, type, help, required, default, options, min, max]
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string, enum: [text, textarea, secret, number, boolean, select] }
        help: { type: string }
        required: { type: boolean }
        default: { $ref: '#/components/schemas/SettingValue' }
        options:
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: string }
              label: { type: string }
        min: { type: number, nullable: true }
        max: { type: number, nullable: true }
    ModuleImportField:
      type: object
      required: [key, label, type, required, help]
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string, enum: [text, number, money, date, boolean] }
        required: { type: boolean }
        help: { type: string }
    ModuleImportInfo:
      type: object
      required: [available, label, description, fields, ai_available]
      properties:
        available: { type: boolean }
        label: { type: string }
        description: { type: string }
        fields: { type: array, items: { $ref: '#/components/schemas/ModuleImportField' } }
        ai_available: { type: boolean }
    ModuleImportMapping:
      type: object
      properties:
        columns: { type: object, additionalProperties: { type: string, nullable: true } }
        header_row: { type: integer }
        date_format: { type: string, enum: [ymd, mdy, dmy] }
        decimal_comma: { type: boolean }
    ModuleImportProblem:
      type: object
      required: [row, message]
      properties:
        row: { type: integer }
        message: { type: string }
    ModuleImportPlan:
      type: object
      required: [id, filename, detection, mapping, headers, sample, row_count, ready_rows, preview, problems, missing, check]
      properties:
        id: { type: string }
        filename: { type: string }
        detection: { type: object, required: [source, note], properties: { source: { type: string, enum: [ai, rules] }, note: { type: string } } }
        mapping:
          type: object
          required: [columns, header_row, date_format, decimal_comma]
          properties:
            columns: { type: object, additionalProperties: { type: string, nullable: true } }
            header_row: { type: integer }
            date_format: { type: string, enum: [ymd, mdy, dmy] }
            decimal_comma: { type: boolean }
        headers: { type: array, items: { type: string } }
        sample: { type: array, items: { type: array, items: { type: string } } }
        row_count: { type: integer }
        ready_rows: { type: integer }
        preview: { type: array, items: { type: object, additionalProperties: true } }
        problems: { type: array, items: { $ref: '#/components/schemas/ModuleImportProblem' } }
        missing: { type: array, items: { type: string } }
        check:
          type: object
          nullable: true
          required: [summary, errors]
          properties:
            summary: { type: string }
            errors: { type: array, items: { $ref: '#/components/schemas/ModuleImportProblem' } }
    ModuleSettings:
      type: object
      required: [fields, values, secrets_set, page]
      properties:
        fields:
          type: array
          items: { $ref: '#/components/schemas/SettingsField' }
        values:
          type: object
          additionalProperties: { $ref: '#/components/schemas/SettingValue' }
        secrets_set:
          type: object
          additionalProperties: { type: boolean }
        page: { type: string, nullable: true, description: 'URL of an extra settings page from the module, shown below the form' }
    BackupSchedule:
      type: object
      required: [enabled, days, time, timezone]
      properties:
        enabled: { type: boolean }
        days: { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
        time: { type: string, example: '02:30' }
        timezone: { type: string, example: America/Toronto }
    ShareTarget:
      type: object
      description: A network share (SMB/CIFS) for backups
      required: [enabled, mode, path, server, share, directory, username, has_password, domain, keep_days]
      properties:
        enabled: { type: boolean }
        mode: { type: string, enum: [smb, folder], description: 'smb: Ledger connects to the share itself; folder: a directory already mounted into the container' }
        path: { type: string, description: 'folder: directory inside the container (under /app/csv_data or /mnt)' }
        server: { type: string, description: 'smb: server name or IP address', example: truenas.local }
        share: { type: string, description: "smb: the share's name", example: backups }
        directory: { type: string, description: 'smb: folder inside the share (created if missing)', example: ledger }
        username: { type: string }
        has_password: { type: boolean }
        domain: { type: string, description: 'Workgroup or Windows domain, if needed' }
        keep_days: { type: integer, minimum: 1, maximum: 3650 }
    ShareTargetChange:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        mode: { type: string, enum: [smb, folder] }
        path: { type: string }
        server: { type: string }
        share: { type: string }
        directory: { type: string }
        username: { type: string }
        password: { type: string, nullable: true, description: 'Omitted or null keeps the saved one; "" clears it' }
        domain: { type: string }
        keep_days: { type: integer, minimum: 1, maximum: 3650 }
    BackupConfigChange:
      type: object
      properties:
        schedule: { $ref: '#/components/schemas/BackupSchedule' }
        include_csv: { type: boolean }
        share: { $ref: '#/components/schemas/ShareTargetChange' }
        google:
          type: object
          required: [enabled, client_id, keep_count]
          properties:
            enabled: { type: boolean }
            client_id: { type: string }
            client_secret: { type: string, nullable: true }
            keep_count: { type: integer, minimum: 1, maximum: 1000 }
    RestorableBackup:
      type: object
      required: [source, name, size_bytes, modified_at]
      properties:
        source: { type: string, enum: [share, google] }
        name: { type: string, description: The backup's folder }
        size_bytes: { type: integer, description: 0 when not known (Google Drive) }
        modified_at: { type: string, format: date-time }
    BackupInfo:
      type: object
      description: The current organization's backups (each organization has its own settings, schedule and destinations)
      required: [available, config, status, next_run, share_files, restore, upload, can_change_folder]
      properties:
        upload:
          type: object
          nullable: true
          description: A dump file uploaded for a restore, ready to use
          required: [filename, size_bytes, uploaded_at]
          properties:
            filename: { type: string }
            size_bytes: { type: integer }
            uploaded_at: { type: string, format: date-time }
        can_change_folder: { type: boolean, description: Whether this user may choose another folder on the server (server admins only) }
        available: { type: boolean, description: Backups are set up on this server }
        restore:
          type: object
          description: The restore in progress, or the last one
          required: [state, phase, message, backup, source, started_at, finished_at, requested_by]
          properties:
            state: { type: string, enum: [idle, running, ok, error] }
            phase: { type: string, enum: ['', backup, fetch, waiting, restore, swap] }
            message: { type: string }
            backup: { type: string }
            source: { type: string, enum: ['', share, google, upload] }
            started_at: { type: string, format: date-time, nullable: true }
            finished_at: { type: string, format: date-time, nullable: true }
            requested_by: { type: string }
        config:
          type: object
          required: [schedule, share, google, include_csv]
          properties:
            schedule: { $ref: '#/components/schemas/BackupSchedule' }
            include_csv: { type: boolean, description: 'Also save CSV copies beside each dump: the General Ledger and each module''s tables' }
            share: { $ref: '#/components/schemas/ShareTarget' }
            google:
              type: object
              required: [enabled, client_id, has_client_secret, connected, account, keep_count]
              properties:
                enabled: { type: boolean }
                client_id: { type: string }
                has_client_secret: { type: boolean }
                connected: { type: boolean }
                account: { type: string }
                keep_count: { type: integer }
        status:
          type: object
          required: [state, trigger, started_at, finished_at, message, file, size_bytes, results, last_scheduled_for, last_ok]
          properties:
            state: { type: string, enum: [idle, running, ok, warning, error] }
            trigger: { type: string, enum: [manual, scheduled], nullable: true }
            started_at: { type: string, format: date-time, nullable: true }
            finished_at: { type: string, format: date-time, nullable: true }
            message: { type: string }
            file: { type: string, nullable: true }
            size_bytes: { type: integer, nullable: true }
            results:
              type: array
              items:
                type: object
                required: [target, ok, message]
                properties:
                  target: { type: string, enum: [share, google] }
                  ok: { type: boolean }
                  message: { type: string }
            last_scheduled_for: { type: string, format: date-time, nullable: true }
            last_ok:
              type: object
              required: [share, google]
              properties:
                share: { type: string, format: date-time, nullable: true }
                google: { type: string, format: date-time, nullable: true }
        next_run: { type: string, format: date-time, nullable: true }
        share_files:
          type: array
          items:
            type: object
            required: [name, size_bytes, modified_at]
            properties:
              name: { type: string }
              size_bytes: { type: integer }
              modified_at: { type: string, format: date-time }
    Role:
      type: string
      enum: [admin, bookkeeper, viewer]
      description: admin manages everything; bookkeeper works in the books; viewer reads
    MainRole:
      type: string
      enum: [admin, bookkeeper, viewer, none]
      description: A role in the main books; none gives no access to them (the user works in other organizations)
    SearchResults:
      type: object
      required: [query, groups]
      properties:
        query: { type: string }
        groups:
          type: array
          items:
            type: object
            required: [source, label, results]
            properties:
              source: { type: string }
              label: { type: string }
              results:
                type: array
                items:
                  type: object
                  required: [title, subtitle, href]
                  properties:
                    title: { type: string }
                    subtitle: { type: string }
                    href: { type: string }
    ModuleChoice:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    LlmInfo:
      type: object
      required: [available, config, modules, usage]
      properties:
        available: { type: boolean }
        config:
          type: object
          required: [connections, allow_modules, configured, images_configured, providers, uses, defaults]
          properties:
            connections:
              type: array
              items:
                type: object
                required: [id, name, provider, model, base_url, has_api_key, effort, max_tokens, uses, configured]
                properties:
                  id: { type: string }
                  name: { type: string }
                  provider: { type: string, enum: [anthropic, ollama, openai] }
                  model: { type: string }
                  base_url: { type: string }
                  has_api_key: { type: boolean }
                  effort: { type: string, enum: [low, medium, high] }
                  max_tokens: { type: integer }
                  uses: { type: array, items: { type: string, enum: [text, images] } }
                  configured: { type: boolean }
            allow_modules: { type: array, items: { type: string } }
            configured: { type: boolean, description: Something answers text requests }
            images_configured: { type: boolean, description: Something answers requests with images or documents }
            providers: { type: array, items: { type: string } }
            uses: { type: array, items: { type: string } }
            defaults:
              type: object
              additionalProperties:
                type: object
                required: [model, base_url]
                properties:
                  model: { type: string }
                  base_url: { type: string }
        modules: { type: array, items: { $ref: '#/components/schemas/ModuleChoice' } }
        usage:
          type: object
          required: [last_30_days, recent]
          properties:
            last_30_days:
              type: array
              items:
                type: object
                required: [source, calls, failed, input_tokens, output_tokens]
                properties:
                  source: { type: string }
                  calls: { type: integer }
                  failed: { type: integer }
                  input_tokens: { type: integer }
                  output_tokens: { type: integer }
            recent:
              type: array
              items:
                type: object
                required: [source, connection, model, input_tokens, output_tokens, ok, error, duration_ms, created_at]
                properties:
                  source: { type: string }
                  connection: { type: string }
                  model: { type: string }
                  input_tokens: { type: integer, nullable: true }
                  output_tokens: { type: integer, nullable: true }
                  ok: { type: boolean }
                  error: { type: string }
                  duration_ms: { type: integer }
                  created_at: { type: string, format: date-time }
    GmailInfo:
      type: object
      required: [available, config, modules]
      properties:
        available: { type: boolean }
        config:
          type: object
          required: [client_id, has_client_secret, connected, account, can_read, can_send, allow_read, allow_send, redirect_uri]
          properties:
            client_id: { type: string }
            has_client_secret: { type: boolean }
            connected: { type: boolean }
            account: { type: string }
            can_read: { type: boolean }
            can_send: { type: boolean }
            allow_read: { type: array, items: { type: string } }
            allow_send: { type: array, items: { type: string } }
            redirect_uri: { type: string }
        modules: { type: array, items: { $ref: '#/components/schemas/ModuleChoice' } }
    ModulesInfo:
      type: object
      required: [installer_available, modules, nav]
      properties:
        installer_available: { type: boolean }
        modules:
          type: array
          items: { $ref: '#/components/schemas/ModuleInfo' }
        nav:
          type: array
          description: Sidebar entries of running modules
          items:
            type: object
            required: [id, label, icon, icon_path, icon_fill, icon_url]
            properties:
              id: { type: string }
              label: { type: string }
              icon: { type: string, nullable: true, description: One of Ledger's named icons }
              icon_path: { type: string, nullable: true, description: 'A 24x24 SVG path drawn by the module' }
              icon_fill: { type: boolean, description: Fill icon_path instead of stroking it }
              icon_url: { type: string, nullable: true, description: 'An SVG file from the module, used as a mask' }
