openapi: 3.0.3
info:
  title: Ledger API
  version: 0.6.0
  description: |
    API for a lightweight double-entry accounting ledger.

    ## Money
    Every monetary value is an **integer number of cents**. Floating-point
    numbers are never used. Integers are capped at 9007199254740991 (2^53 - 1)
    so they are exact in JavaScript.

    ## Currencies (CAD and USD)
    Every account has one fixed currency, and each line is in its account's
    currency. A journal entry must balance **within each currency**. Amounts
    in different currencies are never added together: reports give totals per
    currency. To move value between currencies, post through an FX clearing
    account in each currency (type `equity`, e.g. "Currency trading"), e.g.
    buying USD 1,000.00 for CAD 1,370.00:

    | account               | debit    | credit   |
    |-----------------------|----------|----------|
    | 1900 FX clearing CAD  | 1370.00  |          |
    | 1000 Bank CAD         |          | 1370.00  |
    | 1010 Bank USD         | 1000.00  |          |
    | 1910 FX clearing USD  |          | 1000.00  |

    ## Accounts are identified by code
    Accounts are referenced everywhere by their `code` (e.g. `1000`), which
    never changes once created. Internal database ids are not exposed.

    ## Double entry
    A journal entry has at least two lines. Each line is either a debit or a
    credit: exactly one of `debit_cents` / `credit_cents` is greater than zero
    and the other is zero. The database enforces these rules as well.

    ## Immutability
    Posted journal entries cannot be edited or deleted. To correct a mistake,
    post a reversing entry (`POST /journal-entries/{id}/reverse`) and then a
    new, correct entry.

    ## CSV files
    Exports and imports live in the server's CSV directory (`/app/csv_data`).
    Exports are UTF-8 encoded, comma separated, with a header row and no BOM.
    Files can be added by uploading them (`POST /files`) or by copying them
    to the share directly.

    ## Authentication
    Log in with `POST /auth/login`; the server sets an HttpOnly, SameSite=Strict
    session cookie (`ledger_session`). Every endpoint except `/health`,
    `/auth/login` and `/auth/logout` requires it and answers 401 without it.
    Sessions end after 8 hours of inactivity or 7 days. Users are managed on
    the server with `ledger user add|passwd|disable|enable|list`; there is no
    self-registration. Repeated failed logins are refused with 429 for 15
    minutes: 10 per username and client, or 30 per username from anywhere.

    ## Automatic updates
    `/system/update` shows the installed version and the updater's status,
    and stores the update schedule. A root service on the server
    (`ledger-update.timer`) reads the schedule, installs new GitHub releases
    and reboots the container. The app itself never installs anything.

    ## Modules
    Modules add features (invoicing, dashboards, integrations) from GitHub
    repositories. `/modules` lists them and records which ones you want; the
    root updater installs them. A running module serves its own API under
    `/api/v1/m/{moduleId}/...` (session required) and its UI under
    `/m/{moduleId}/`. See docs/MODULES.md.

    ## Requests
    JSON request bodies must be sent with `Content-Type: application/json`
    (otherwise 415). Cross-site state-changing requests from browsers are
    rejected with 403, so other web pages cannot act on the ledger.
servers:
  - url: /api/v1

security:
  - sessionCookie: []

tags:
  - name: Auth
  - name: System
  - name: Dashboard
  - name: Accounts
  - name: Journal Entries
  - name: Reports
  - name: Files
  - name: Modules

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in and receive a session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in; `Set-Cookie` carries the session
          headers:
            Set-Cookie:
              schema: { type: string, example: 'ledger_session=...; Path=/; HttpOnly; SameSite=Strict' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the current session
      security: []
      responses:
        '204': { description: Logged out (cookie cleared) }
        default: { $ref: '#/components/responses/Error' }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: The logged-in user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /auth/password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change your own password (ends your other sessions)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChange' }
      responses:
        '204': { description: Password changed }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /settings/sidebar:
    get:
      tags: [Auth]
      operationId: getSidebar
      summary: The current user's sidebar order and hidden entries
      responses:
        '200':
          description: Sidebar preferences (empty means the default order)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SidebarPrefs' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [Auth]
      operationId: putSidebar
      summary: Save the current user's sidebar order and hidden entries
      description: |
        Entries are listed in display order. Entries not listed (for example a
        module installed later) are shown after the listed ones.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SidebarPrefs' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SidebarPrefs' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /health:
    get:
      tags: [System]
      operationId: getHealth
      security: []
      summary: Liveness and database connectivity check
      responses:
        '200':
          description: Service and database are reachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Database unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /currencies:
    get:
      tags: [System]
      operationId: listCurrencies
      summary: List supported currencies
      responses:
        '200':
          description: Currencies ordered by code
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CurrencyInfo' }
        default: { $ref: '#/components/responses/Error' }

  /accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List the chart of accounts
      parameters:
        - name: include_inactive
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Accounts ordered by code
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Account' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /accounts/{accountCode}:
    parameters:
      - $ref: '#/components/parameters/AccountCode'
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get one account with its current balance
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Accounts]
      operationId: updateAccount
      summary: Rename, re-describe or (de)activate an account
      description: |
        The account `code`, `type` and `currency` are not editable. Inactive accounts
        keep their history but cannot receive new postings.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountUpdate' }
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /accounts/{accountCode}/ledger:
    parameters:
      - $ref: '#/components/parameters/AccountCode'
    get:
      tags: [Accounts]
      operationId: getAccountLedger
      summary: Posting history of one account with running balance (in the account's currency)
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Ledger lines ordered by date, entry id, line number
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountLedger' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /journal-entries:
    get:
      tags: [Journal Entries]
      operationId: listJournalEntries
      summary: List posted journal entries (newest first)
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: account_code
          in: query
          description: Only entries with at least one line on this account
          schema: { $ref: '#/components/schemas/AccountCode' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of journal entries
          content:
            application/json:
              schema:
                type: object
                required: [data, limit, offset]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/JournalEntry' }
                  limit: { type: integer }
                  offset: { type: integer }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Journal Entries]
      operationId: createJournalEntry
      summary: Post a balanced journal entry
      description: |
        The header and all lines are written in a single database transaction.
        If any line is invalid, or the entry does not balance in every
        currency, nothing is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JournalEntryCreate' }
            example:
              entry_date: '2026-10-01'
              description: Office supplies paid in cash
              reference: RCPT-0042
              lines:
                - { account_code: '6100', debit_cents: 4599, credit_cents: 0, memo: Printer paper }
                - { account_code: '1000', debit_cents: 0, credit_cents: 4599 }
      responses:
        '201':
          description: Entry posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntry' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /journal-entries/{entryId}:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    get:
      tags: [Journal Entries]
      operationId: getJournalEntry
      summary: Get one journal entry with its lines
      responses:
        '200':
          description: The journal entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntry' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /journal-entries/{entryId}/reverse:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    post:
      tags: [Journal Entries]
      operationId: reverseJournalEntry
      summary: Post a reversing entry (swaps every debit and credit)
      description: An entry can be reversed only once, and a reversal cannot itself be reversed.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReverseRequest' }
      responses:
        '201':
          description: Reversing entry posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntry' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Financial summary, notifications and to-dos
      description: |
        The summary is per currency (currencies are never added together):
        net worth (assets minus liabilities) today, revenue, expenses and net
        income for this month and year to date, and the largest expense
        accounts this month. Notifications are the ones not dismissed or
        expired; to-dos are the open ones, then those done in the last 7 days.
        Modules post items with `ctx.dashboard` (see docs/MODULES.md).
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        default: { $ref: '#/components/responses/Error' }

  /dashboard/items/{itemId}/close:
    post:
      tags: [Dashboard]
      operationId: closeDashboardItem
      summary: Dismiss a notification or mark a to-do done
      parameters:
        - { $ref: '#/components/parameters/ItemId' }
      responses:
        '200':
          description: The item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardItem' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /dashboard/items/{itemId}/reopen:
    post:
      tags: [Dashboard]
      operationId: reopenDashboardItem
      summary: Mark a to-do not done
      parameters:
        - { $ref: '#/components/parameters/ItemId' }
      responses:
        '200':
          description: The to-do
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardItem' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /reports/trial-balance:
    get:
      tags: [Reports]
      operationId: getTrialBalance
      summary: Debit/credit balance of every account as of a date, totalled per currency
      parameters:
        - name: as_of
          in: query
          description: Include entries dated on or before this day (default today)
          schema: { type: string, format: date }
        - name: currency
          in: query
          description: Only accounts in this currency
          schema: { $ref: '#/components/schemas/Currency' }
      responses:
        '200':
          description: Trial balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrialBalance' }
        default: { $ref: '#/components/responses/Error' }

  /reports/balance-sheet:
    get:
      tags: [Reports]
      operationId: getBalanceSheet
      summary: Assets, liabilities and equity as of a date, per currency
      description: |
        Amounts use each account's natural sign. Revenue minus expenses to
        date (not yet closed to an equity account) is reported as
        `net_income_cents` and included in total equity, so
        assets = liabilities + equity.
      parameters:
        - name: as_of
          in: query
          description: Include entries dated on or before this day (default today)
          schema: { type: string, format: date }
        - name: currency
          in: query
          schema: { $ref: '#/components/schemas/Currency' }
      responses:
        '200':
          description: Balance sheet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceSheet' }
        default: { $ref: '#/components/responses/Error' }

  /reports/income-statement:
    get:
      tags: [Reports]
      operationId: getIncomeStatement
      summary: Revenue, expenses and net income for a period, per currency
      parameters:
        - name: from
          in: query
          description: Inclusive start date (default January 1 of the `to` year)
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive end date (default today)
          schema: { type: string, format: date }
        - name: currency
          in: query
          schema: { $ref: '#/components/schemas/Currency' }
      responses:
        '200':
          description: Income statement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncomeStatement' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /exports/general-ledger:
    post:
      tags: [Files]
      operationId: exportGeneralLedger
      summary: Write the General Ledger to a CSV file in the CSV directory
      description: |
        Columns: `account_code,account_name,account_type,currency,entry_date,
        journal_entry_id,line_id,line_number,reference,description,memo,debit,
        credit,running_balance`. Rows are grouped by account; the running
        balance is per account (debit-positive) in that account's currency.
        When `from` is given, each account starts with an "Opening balance" row.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportRequest' }
      responses:
        '201':
          description: File written
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsvFile' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /files:
    get:
      tags: [Files]
      operationId: listCsvFiles
      summary: List CSV files in the CSV directory
      responses:
        '200':
          description: Files, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CsvFile' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Files]
      operationId: uploadCsvFile
      summary: Upload a CSV file into the CSV directory
      description: |
        The file is stored under its own name, which must match the
        `CsvFilename` pattern. Existing files are never overwritten (409).
        Max 10 MiB; content must be UTF-8 text (a leading BOM is allowed).
        Uploading does not import anything: call `POST /imports/journal-entries`
        afterwards.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: File stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsvFile' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /files/{filename}:
    parameters:
      - $ref: '#/components/parameters/Filename'
    get:
      tags: [Files]
      operationId: downloadCsvFile
      summary: Download a CSV file
      responses:
        '200':
          description: File contents
          content:
            text/csv:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /imports/journal-entries:
    post:
      tags: [Files]
      operationId: importJournalEntries
      summary: Import journal entries from a CSV file in the CSV directory
      description: |
        The whole file is imported in **one database transaction**: if any
        entry is invalid, nothing is imported and every problem is reported
        with its row number. A file whose exact content (SHA-256) was imported
        before is refused with 409, so the same file can't be posted twice.

        Format: UTF-8 (a leading BOM is tolerated), comma separated, header
        row required, column names case-insensitive and in any order, at most
        10 MiB and 50,000 rows.

        | column         | required | notes |
        |----------------|----------|-------|
        | `entry_key`    | yes | Rows with the same key form one journal entry; they must be contiguous |
        | `entry_date`   | yes | `YYYY-MM-DD`; may be blank on later rows of an entry |
        | `description`  | yes | May be blank on later rows of an entry |
        | `account_code` | yes | Existing, active account |
        | `debit`        | yes | Decimal, max two decimals (`1234.56`), no signs/separators; blank = 0 |
        | `credit`       | yes | Same as debit; exactly one of debit/credit is non-zero |
        | `reference`    | no  | May be blank on later rows of an entry |
        | `memo`         | no  | Per line |
        | `currency`     | no  | `CAD`/`USD`; if given, must match the account's currency |

        Example:
        ```
        entry_key,entry_date,description,account_code,debit,credit
        S1,2026-10-01,Cash sale,1000,250.00,
        S1,,,4000,,250.00
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRequest' }
      responses:
        '201':
          description: All entries imported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /system/update:
    get:
      tags: [System]
      operationId: getUpdate
      summary: Installed version, update schedule and the updater's last result
      responses:
        '200':
          description: Update information
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateInfo' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /system/update/schedule:
    put:
      tags: [System]
      operationId: setUpdateSchedule
      summary: Set when updates are installed and whether the container reboots
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSchedule' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateInfo' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /system/update/check:
    post:
      tags: [System]
      operationId: checkForUpdate
      summary: Check GitHub now and install a newer release if there is one
      description: |
        Queues a run of the updater (it starts within seconds). It reboots
        only if it installed a release and the schedule's reboot policy is
        not `never`. Poll `GET /system/update` for progress.
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateInfo' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /modules:
    get:
      tags: [Modules]
      operationId: listModules
      summary: Installed and wanted modules, and sidebar entries
      responses:
        '200':
          description: Modules
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModulesInfo' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Modules]
      operationId: addModule
      summary: Add a module from a GitHub repository (installed within seconds)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModuleRepo' }
      responses:
        '202':
          description: Queued for installation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModulesInfo' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /modules/preview:
    post:
      tags: [Modules]
      operationId: previewModule
      summary: Read a repository's module manifest from its latest release, without installing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModuleRepo' }
      responses:
        '200':
          description: The module that would be installed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModulePreview' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /modules/sync:
    post:
      tags: [Modules]
      operationId: syncModules
      summary: Update all modules to their latest releases now
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModulesInfo' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /modules/{moduleId}:
    delete:
      tags: [Modules]
      operationId: removeModule
      summary: Remove a module (its data is kept)
      parameters:
        - name: moduleId
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,31}$' }
      responses:
        '202':
          description: Queued for removal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModulesInfo' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ledger_session

  parameters:
    AccountCode:
      name: accountCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/AccountCode' }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    EntryId:
      name: entryId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Filename:
      name: filename
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CsvFilename' }
    From:
      name: from
      in: query
      description: Inclusive start date
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      description: Inclusive end date
      schema: { type: string, format: date }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Cents:
      description: Non-negative amount in cents.
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
    SignedCents:
      description: Signed amount in cents (positive = debit balance, negative = credit balance).
      type: integer
      format: int64
      minimum: -9007199254740991
      maximum: 9007199254740991
    AccountType:
      type: string
      enum: [asset, liability, equity, revenue, expense]
    AccountCode:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$'
      example: '1000'
    Currency:
      type: string
      enum: [CAD, USD]
    CurrencyInfo:
      type: object
      required: [code, name, minor_units]
      properties:
        code: { $ref: '#/components/schemas/Currency' }
        name: { type: string, example: Canadian dollar }
        minor_units: { type: integer, enum: [2] }
    CurrencyTotal:
      type: object
      required: [currency, amount_cents]
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        amount_cents: { $ref: '#/components/schemas/Cents' }
    CsvFilename:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}\.csv$'

    User:
      type: object
      required: [username, is_active, created_at, last_login_at]
      properties:
        username: { type: string, example: alice }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true }
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, description: Case-insensitive }
        password: { type: string, format: password }
    PasswordChange:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 4, description: '4+ characters (a 4-digit PIN is allowed), at most 72 bytes' }

    ReportLine:
      type: object
      required: [account_code, account_name, amount_cents]
      properties:
        account_code: { $ref: '#/components/schemas/AccountCode' }
        account_name: { type: string }
        amount_cents:
          allOf: [{ $ref: '#/components/schemas/SignedCents' }]
          description: Natural-sign balance (a contra balance is negative)
    BalanceSheet:
      type: object
      required: [as_of, currencies]
      properties:
        as_of: { type: string, format: date }
        currencies:
          type: array
          items:
            type: object
            required: [currency, assets, liabilities, equity, net_income_cents, total_assets_cents,
                       total_liabilities_cents, total_equity_cents, balanced]
            properties:
              currency: { $ref: '#/components/schemas/Currency' }
              assets: { type: array, items: { $ref: '#/components/schemas/ReportLine' } }
              liabilities: { type: array, items: { $ref: '#/components/schemas/ReportLine' } }
              equity: { type: array, items: { $ref: '#/components/schemas/ReportLine' } }
              net_income_cents:
                allOf: [{ $ref: '#/components/schemas/SignedCents' }]
                description: Revenue minus expenses to date, not yet closed to equity
              total_assets_cents: { $ref: '#/components/schemas/SignedCents' }
              total_liabilities_cents: { $ref: '#/components/schemas/SignedCents' }
              total_equity_cents:
                allOf: [{ $ref: '#/components/schemas/SignedCents' }]
                description: Equity accounts plus net income
              balanced: { type: boolean, description: assets = liabilities + equity }
    IncomeStatement:
      type: object
      required: [from, to, currencies]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        currencies:
          type: array
          items:
            type: object
            required: [currency, revenue, expenses, total_revenue_cents, total_expenses_cents, net_income_cents]
            properties:
              currency: { $ref: '#/components/schemas/Currency' }
              revenue: { type: array, items: { $ref: '#/components/schemas/ReportLine' } }
              expenses: { type: array, items: { $ref: '#/components/schemas/ReportLine' } }
              total_revenue_cents: { $ref: '#/components/schemas/SignedCents' }
              total_expenses_cents: { $ref: '#/components/schemas/SignedCents' }
              net_income_cents: { $ref: '#/components/schemas/SignedCents' }

    Health:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [ok, unreachable] }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code
              enum:
                - bad_request
                - validation_failed
                - not_found
                - conflict
                - unauthorized
                - forbidden
                - payload_too_large
                - too_many_requests
                - internal_error
            message: { type: string }
            details:
              type: array
              items:
                type: object
                required: [message]
                properties:
                  field:
                    type: string
                    description: |
                      Offending field, e.g. `lines[1].debit_cents` (JSON) or
                      `row 7.account_code` (CSV import)
                  message: { type: string }

    Account:
      type: object
      required: [code, name, type, currency, description, is_active, balance_cents, created_at, updated_at]
      properties:
        code: { $ref: '#/components/schemas/AccountCode' }
        name: { type: string }
        type: { $ref: '#/components/schemas/AccountType' }
        currency: { $ref: '#/components/schemas/Currency' }
        description: { type: string }
        is_active: { type: boolean }
        balance_cents:
          allOf: [{ $ref: '#/components/schemas/SignedCents' }]
          description: Current balance in the account's currency (debit-positive)
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AccountCreate:
      type: object
      required: [code, name, type, currency]
      additionalProperties: false
      properties:
        code: { $ref: '#/components/schemas/AccountCode' }
        name: { type: string, minLength: 1, maxLength: 200, example: Bank CAD }
        type: { $ref: '#/components/schemas/AccountType' }
        currency: { $ref: '#/components/schemas/Currency' }
        description: { type: string, maxLength: 1000, default: '' }
    AccountUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        is_active: { type: boolean }

    JournalLineCreate:
      type: object
      required: [account_code, debit_cents, credit_cents]
      additionalProperties: false
      description: |
        Exactly one of debit_cents / credit_cents must be > 0. The amount is
        in the account's currency.
      properties:
        account_code: { $ref: '#/components/schemas/AccountCode' }
        debit_cents: { $ref: '#/components/schemas/Cents' }
        credit_cents: { $ref: '#/components/schemas/Cents' }
        memo: { type: string, maxLength: 500, default: '' }
    JournalEntryCreate:
      type: object
      required: [entry_date, description, lines]
      additionalProperties: false
      properties:
        entry_date: { type: string, format: date }
        description: { type: string, minLength: 1, maxLength: 500 }
        reference: { type: string, maxLength: 100, default: '' }
        lines:
          type: array
          minItems: 2
          maxItems: 1000
          items: { $ref: '#/components/schemas/JournalLineCreate' }

    JournalLine:
      type: object
      required: [id, line_number, account_code, account_name, currency, debit_cents, credit_cents, memo]
      properties:
        id: { type: integer, format: int64 }
        line_number: { type: integer }
        account_code: { $ref: '#/components/schemas/AccountCode' }
        account_name: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        debit_cents: { $ref: '#/components/schemas/Cents' }
        credit_cents: { $ref: '#/components/schemas/Cents' }
        memo: { type: string }
    JournalEntry:
      type: object
      required: [id, entry_date, description, reference, reverses_id, reversed_by_id, import_id, created_by, posted_at, totals, lines]
      properties:
        id: { type: integer, format: int64 }
        entry_date: { type: string, format: date }
        description: { type: string }
        reference: { type: string }
        reverses_id:
          type: integer
          format: int64
          nullable: true
          description: Set when this entry reverses another entry
        reversed_by_id:
          type: integer
          format: int64
          nullable: true
          description: Set when another entry reverses this one
        import_id:
          type: integer
          format: int64
          nullable: true
          description: Set when the entry was created by a CSV import
        created_by:
          type: string
          nullable: true
          description: Username of the person who posted the entry
        posted_at: { type: string, format: date-time }
        totals:
          type: array
          description: Per-currency sum of debits (always equal to the sum of credits), ordered by currency
          items: { $ref: '#/components/schemas/CurrencyTotal' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/JournalLine' }
    ReverseRequest:
      type: object
      additionalProperties: false
      properties:
        entry_date:
          type: string
          format: date
          description: Date of the reversing entry (default today)
        description:
          type: string
          maxLength: 500
          description: Default "Reversal of entry #<id>"

    AccountLedger:
      type: object
      required: [account, opening_balance_cents, closing_balance_cents, lines]
      properties:
        account: { $ref: '#/components/schemas/Account' }
        opening_balance_cents: { $ref: '#/components/schemas/SignedCents' }
        closing_balance_cents: { $ref: '#/components/schemas/SignedCents' }
        lines:
          type: array
          items:
            type: object
            required: [journal_entry_id, line_id, entry_date, description, memo, debit_cents, credit_cents, running_balance_cents]
            properties:
              journal_entry_id: { type: integer, format: int64 }
              line_id: { type: integer, format: int64 }
              entry_date: { type: string, format: date }
              description: { type: string }
              reference: { type: string }
              memo: { type: string }
              debit_cents: { $ref: '#/components/schemas/Cents' }
              credit_cents: { $ref: '#/components/schemas/Cents' }
              running_balance_cents: { $ref: '#/components/schemas/SignedCents' }

    TrialBalance:
      type: object
      required: [as_of, rows, totals]
      properties:
        as_of: { type: string, format: date }
        rows:
          type: array
          description: Ordered by currency, then account code
          items:
            type: object
            required: [account_code, account_name, account_type, currency, debit_cents, credit_cents]
            properties:
              account_code: { $ref: '#/components/schemas/AccountCode' }
              account_name: { type: string }
              account_type: { $ref: '#/components/schemas/AccountType' }
              currency: { $ref: '#/components/schemas/Currency' }
              debit_cents: { $ref: '#/components/schemas/Cents' }
              credit_cents: { $ref: '#/components/schemas/Cents' }
        totals:
          type: array
          description: One row per currency; debits always equal credits
          items:
            type: object
            required: [currency, debit_cents, credit_cents]
            properties:
              currency: { $ref: '#/components/schemas/Currency' }
              debit_cents: { $ref: '#/components/schemas/Cents' }
              credit_cents: { $ref: '#/components/schemas/Cents' }

    ExportRequest:
      type: object
      additionalProperties: false
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        currency:
          allOf: [{ $ref: '#/components/schemas/Currency' }]
          description: Only accounts in this currency (default all)
    CsvFile:
      type: object
      required: [filename, size_bytes, modified_at]
      properties:
        filename: { $ref: '#/components/schemas/CsvFilename' }
        size_bytes: { type: integer, format: int64 }
        modified_at: { type: string, format: date-time }
        row_count:
          type: integer
          description: Data rows written (export responses only)

    ImportRequest:
      type: object
      required: [filename]
      additionalProperties: false
      properties:
        filename: { $ref: '#/components/schemas/CsvFilename' }
    ImportResult:
      type: object
      required: [import_id, filename, sha256, entries_imported, lines_imported]
      properties:
        import_id: { type: integer, format: int64 }
        filename: { type: string }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        entries_imported: { type: integer }
        lines_imported: { type: integer }

    UpdateSchedule:
      type: object
      additionalProperties: false
      required: [enabled, days, time, timezone, reboot]
      properties:
        enabled: { type: boolean, description: Whether scheduled runs happen }
        days:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items: { type: integer, minimum: 0, maximum: 6 }
          description: Days of the week, 0 = Sunday ... 6 = Saturday
        time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '03:30', description: 24-hour local time }
        timezone: { type: string, example: America/Winnipeg, description: IANA time zone for days and time }
        reboot:
          type: string
          enum: [never, after_update, always]
          description: |
            When a scheduled run reboots the container: never, only after
            installing a release, or always (even when already up to date).
    UpdateStatus:
      type: object
      required: [state, trigger, message, started_at, finished_at, latest_version, installed_version, last_scheduled_for]
      properties:
        state: { type: string, enum: [idle, running, ok, error] }
        trigger: { type: string, enum: [scheduled, manual], nullable: true }
        message: { type: string }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        latest_version: { type: string, nullable: true, description: Latest release on GitHub at the last check }
        installed_version: { type: string, nullable: true, description: Set when the last run installed a release }
        last_scheduled_for: { type: string, format: date-time, nullable: true }
    UpdateInfo:
      type: object
      required: [current_version, updater_installed, schedule, next_run_at, status]
      properties:
        current_version: { type: string, example: v0.6.0 }
        updater_installed: { type: boolean, description: False when the server was not installed from a release }
        schedule: { $ref: '#/components/schemas/UpdateSchedule' }
        next_run_at: { type: string, format: date-time, nullable: true }
        status:
          type: object
          allOf: [{ $ref: '#/components/schemas/UpdateStatus' }]
          nullable: true
          description: Null until the updater has run once
    ModuleRepo:
      type: object
      additionalProperties: false
      required: [repo]
      properties:
        repo: { type: string, example: someone/ledger-invoicing, description: 'owner/name or a github.com URL' }
    ModuleManifest:
      type: object
      required: [id, name, version, description, ledger, server, ui, nav, migrations]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9-]{1,31}$' }
        name: { type: string }
        version: { type: string }
        description: { type: string }
        ledger: { type: string, nullable: true, example: '>=0.6.0' }
        server: { type: string, nullable: true }
        ui: { type: string, nullable: true }
        nav:
          type: object
          nullable: true
          required: [label, icon]
          properties:
            label: { type: string }
            icon:
              type: string
              nullable: true
              description: Name of a sidebar icon (see docs/MODULES.md); unknown names show the generic module icon
        migrations: { type: string, nullable: true }
    ModulePreview:
      type: object
      required: [repo, tag, manifest, compatible, ledger_version]
      properties:
        repo: { type: string }
        tag: { type: string }
        manifest: { $ref: '#/components/schemas/ModuleManifest' }
        compatible: { type: boolean }
        ledger_version: { type: string }
    SidebarPrefs:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            type: object
            required: [id, hidden]
            properties:
              id:
                type: string
                description: '"core:<page>" (dashboard, journal, new-entry, accounts, reports, files) or "module:<id>"'
                example: core:journal
              hidden: { type: boolean }
    PeriodSummary:
      type: object
      required: [from, to, revenue_cents, expenses_cents, net_income_cents]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        revenue_cents: { $ref: '#/components/schemas/SignedCents' }
        expenses_cents: { $ref: '#/components/schemas/SignedCents' }
        net_income_cents: { $ref: '#/components/schemas/SignedCents' }
    CurrencySummary:
      type: object
      required: [currency, assets_cents, liabilities_cents, net_worth_cents, month, year, top_expenses]
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        assets_cents: { $ref: '#/components/schemas/SignedCents' }
        liabilities_cents: { $ref: '#/components/schemas/SignedCents' }
        net_worth_cents:
          allOf: [{ $ref: '#/components/schemas/SignedCents' }]
          description: Assets minus liabilities
        month: { $ref: '#/components/schemas/PeriodSummary' }
        year: { $ref: '#/components/schemas/PeriodSummary' }
        top_expenses:
          type: array
          description: Up to five expense accounts, largest first, this month
          items: { $ref: '#/components/schemas/ReportLine' }
    DashboardItem:
      type: object
      required: [id, source, source_name, kind, key, title, body, level, link, due_date, created_at, updated_at, expires_at, closed_at, closed_by]
      properties:
        id: { type: integer, format: int64 }
        source: { type: string, description: 'Module id, or "ledger"' }
        source_name: { type: string }
        kind: { type: string, enum: [notification, todo] }
        key: { type: string, description: The poster's own id for the item }
        title: { type: string }
        body: { type: string }
        level: { type: string, enum: [info, success, warning, danger] }
        link: { type: string, description: 'A path inside Ledger, or ""' }
        due_date: { type: string, format: date, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true, description: Dismissed or done }
        closed_by: { type: string, nullable: true, description: Username, when a person closed it }
    Dashboard:
      type: object
      required: [summary, notifications, todos]
      properties:
        summary:
          type: object
          required: [as_of, currencies]
          properties:
            as_of: { type: string, format: date }
            currencies:
              type: array
              items: { $ref: '#/components/schemas/CurrencySummary' }
        notifications:
          type: array
          items: { $ref: '#/components/schemas/DashboardItem' }
        todos:
          type: array
          items: { $ref: '#/components/schemas/DashboardItem' }
    ModuleInfo:
      type: object
      required: [repo, id, name, version, description, nav_label, state, message]
      properties:
        repo: { type: string, nullable: true }
        id: { type: string, nullable: true }
        name: { type: string }
        version: { type: string, nullable: true }
        description: { type: string }
        nav_label: { type: string, nullable: true }
        state:
          type: string
          enum: [running, failed, pending, error, removing]
          description: |
            running; failed (installed but would not load: see message);
            pending (waiting for the installer); error (the installer could
            not install it: see message); removing (taken off the list).
        message: { type: string }
    ModulesInfo:
      type: object
      required: [installer_available, modules, nav]
      properties:
        installer_available: { type: boolean }
        modules:
          type: array
          items: { $ref: '#/components/schemas/ModuleInfo' }
        nav:
          type: array
          description: Sidebar entries of running modules
          items:
            type: object
            required: [id, label, icon]
            properties:
              id: { type: string }
              label: { type: string }
              icon: { type: string, nullable: true }
