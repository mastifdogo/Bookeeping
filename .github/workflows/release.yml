# Builds Ledger and the Proxmox LXC templates and publishes them as a
# GitHub Release.
#
# Trigger it by pushing a version tag:
#   git tag v0.4.0 && git push origin v0.4.0
# or from the Actions tab: Release → Run workflow → enter a tag such as v0.4.0
# (the tag is created on the selected branch's latest commit).
#
# Release assets:
#   ledger-<tag>-linux-amd64.tar.gz           server + Node.js runtime + SQL + deploy scripts
#   debian-12-ledger_<tag>_amd64.tar.zst       Proxmox CT template (Debian 12)
#   SHA256SUMS
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v0.17.0-debian13.1 (a tag with a suffix is published as a pre-release)'
        required: true
        type: string
      suite:
        description: 'Debian release the container template is built on'
        required: false
        default: trixie
        type: choice
        options: [trixie, bookworm]

permissions:
  contents: write # create the release and upload assets

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
      # This branch (debian-13-test) builds the template on Debian 13 unless told otherwise.
      SUITE: ${{ inputs.suite || 'trixie' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::release tags must look like v1.2.3 or v1.2.3-rc.1 (got '$VERSION')"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install image build tools
        # mmdebstrap and Debian's archive keyring come straight from Debian's
        # servers (which the template build uses anyway), not from the
        # runner's Ubuntu mirrors, which are often unreachable from GitHub.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          get() { curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 "$1" -o "$2"; }
          get https://deb.debian.org/debian/dists/bookworm/main/binary-all/Packages.xz "$work/Packages.xz"
          # The keyring of the release being built knows that release's signing keys.
          get "https://deb.debian.org/debian/dists/$SUITE/main/binary-all/Packages.xz" "$work/Packages-suite.xz"
          for pkg in debian-archive-keyring mmdebstrap; do
            list="$work/Packages.xz"; [ "$pkg" = debian-archive-keyring ] && list="$work/Packages-suite.xz"
            read -r file sum < <(xz -dc "$list" | awk -v p="$pkg" '
              $1 == "Package:" { hit = ($2 == p) }
              hit && $1 == "Filename:" { f = $2 }
              hit && $1 == "SHA256:" { s = $2 }
              hit && f && s { print f, s; exit }') || true
            [ -n "$file" ] || { echo "::error::$pkg not found on deb.debian.org"; exit 1; }
            get "https://deb.debian.org/debian/$file" "$work/$pkg.deb"
            echo "$sum  $work/$pkg.deb" | sha256sum -c -
          done
          # Its dependencies (perl, apt) are already on the runner.
          sudo dpkg -i --force-depends "$work/debian-archive-keyring.deb" "$work/mmdebstrap.deb"
          command -v zstd >/dev/null
          mmdebstrap --version

      - name: Build release tarball
        run: make release VERSION="$VERSION"

      - name: Unit tests and type checks
        run: make test

      - name: Integration tests (PostgreSQL)
        run: make test-integration TEST_DATABASE_URL="postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"

      - name: Build LXC templates
        run: |
          sudo deploy/lxc-template/build-lxc-template.sh \
            --suite "$SUITE" --version "$VERSION" \
            --release "dist/ledger-$VERSION-linux-amd64.tar.gz"
          sudo chown -R "$(id -u):$(id -g)" dist

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- "ledger-$VERSION-linux-amd64.tar.gz" ./*-ledger_"$VERSION"_amd64.tar.zst | sed "s| \./| |" > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: |
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$VERSION"
          deb="debian-$([ "$SUITE" = trixie ] && echo 13 || echo 12)-ledger_${VERSION}_amd64.tar.zst"
          sum() { awk -v f="$1" '$2 == f { print $1 }' dist/SHA256SUMS; }
          cat > notes.md <<EOF
          ## Proxmox LXC template (Debian $([ "$SUITE" = trixie ] && echo "13, test build" || echo 12))

          On the Proxmox host (as root), download the template into the local template store:

          \`\`\`sh
          wget -P /var/lib/vz/template/cache $base/$deb
          echo "$(sum "$deb")  /var/lib/vz/template/cache/$deb" | sha256sum -c
          \`\`\`

          If your Proxmox version has **local → CT Templates → Download from URL**, you can
          paste \`$base/$deb\` there instead, with hash algorithm **SHA-256** and checksum
          \`$(sum "$deb")\`. Otherwise download the file and use **Upload**.

          Then create an unprivileged container from it (enable **nesting**), bind-mount your
          CSV directory (\`pct set <ctid> -mp0 /mnt/pve/truenas/ledger,mp=/app/csv_data\`),
          start it, and read the admin password with
          \`pct exec <ctid> -- cat /root/ledger-admin-password\`.
          Full guide: [docs/DEPLOYMENT.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$VERSION/docs/DEPLOYMENT.md#alternative-a-ready-made-lxc-template).

          ## Release tarball (one-command deploy or upgrade)

          \`ledger-$VERSION-linux-amd64.tar.gz\` holds the server, its Node.js runtime, SQL and deploy scripts:

          \`\`\`sh
          tar xzf ledger-$VERSION-linux-amd64.tar.gz && cd ledger-$VERSION-linux-amd64
          ./deploy/proxmox-deploy.sh --csv-path /mnt/pve/truenas/ledger          # new container
          ./deploy/proxmox-deploy.sh --upgrade --ctid <ctid> \\
            --release ../ledger-$VERSION-linux-amd64.tar.gz                    # upgrade
          \`\`\`
          EOF
          cat notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/ledger-"$VERSION"-linux-amd64.tar.gz dist/*-ledger_"$VERSION"_amd64.tar.zst dist/SHA256SUMS)
          if gh release view "$VERSION" >/dev/null 2>&1; then
            # Re-run: replace the assets, keep the release.
            gh release upload "$VERSION" "${assets[@]}" --clobber
            gh release edit "$VERSION" --notes-file notes.md
          else
            prerelease=()
            [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
            gh release create "$VERSION" "${assets[@]}" \
              --title "Ledger $VERSION" --notes-file notes.md --target "$GITHUB_SHA" "${prerelease[@]}"
          fi
