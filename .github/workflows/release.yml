# Builds Ledger and the Proxmox LXC templates and publishes them as a
# GitHub Release.
#
# Trigger it by pushing a version tag:
#   git tag v0.4.0 && git push origin v0.4.0
# or from the Actions tab: Release → Run workflow → enter a tag such as v0.4.0
# (the tag is created on the selected branch's latest commit).
#
# Release assets:
#   ledger-<tag>-linux-amd64.tar.gz           server + Node.js runtime + SQL + deploy scripts
#   ledger-web-<tag>.tar.gz                   the pages (web UI) alone
#   UPDATE.json                               which server release the pages go with
#   SHA256SUMS
#
# A release that changes only the web UI (frontend/, and docs or tests) keeps
# the server version of the release before it. An install on that server then
# replaces just its pages from ledger-web-<tag>.tar.gz: no database backup, no
# install script, no restart; the server's own tests are skipped here. Anything
# else changed means a full release and a full update.
#
# The Proxmox CT template is not rebuilt for every release. It lives in one
# fixed release, `lxc-template`, under a name that never changes
# (debian-13-ledger_amd64.tar.zst), and a container made from it installs the
# latest Ledger release on first boot through the updater. It is rebuilt
# automatically when a release raises the middle (or first) number, e.g.
# v0.27.3 -> v0.28.0, and not for fixes (v0.28.0 -> v0.28.1) or pre-releases.
# Tick "Rebuild the LXC template" to rebuild it for any other release, e.g.
# when deploy/lxc-template/, its packages, PostgreSQL's major version or the
# Debian release changed in a fix release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v0.18.0 (a tag with a suffix, such as v0.18.0-test.1, is published as a pre-release)'
        required: true
        type: string
      template:
        description: 'Rebuild the LXC template even if this release does not raise the middle number (it is rebuilt automatically when it does)'
        required: false
        default: false
        type: boolean
      suite:
        description: 'Debian release the container template is built on'
        required: false
        default: trixie
        type: choice
        options: [trixie, bookworm]

permissions:
  contents: write # create the release and upload assets

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
      # The template is built on Debian 13 unless told otherwise.
      SUITE: ${{ inputs.suite || 'trixie' }}
      TEMPLATE_TAG: lxc-template
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::release tags must look like v1.2.3 or v1.2.3-rc.1 (got '$VERSION')"
            exit 1
          fi

      - name: Decide whether to rebuild the LXC template
        id: template
        # Rebuilt when asked, or when this release raises the middle (or first)
        # number over the newest earlier release. Pre-releases only when asked.
        env:
          ASKED: ${{ inputs.template && 'true' || 'false' }}
        run: |
          set -euo pipefail
          build=$ASKED
          if [ "$build" != true ] && [[ "$VERSION" != *-* ]]; then
            prev=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF "$VERSION" | sort -V | tail -n 1 || true)
            minor() { echo "$1" | sed -E 's/^v([0-9]+)\.([0-9]+)\..*/\1 \2/'; }
            if [ -z "$prev" ]; then
              build=true
            else
              read -r nmaj nmin < <(minor "$VERSION")
              read -r pmaj pmin < <(minor "$prev")
              if (( nmaj > pmaj || (nmaj == pmaj && nmin > pmin) )); then build=true; fi
            fi
            echo "Newest earlier release: ${prev:-none}"
          fi
          echo "Rebuild the LXC template: $build"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Decide whether only the pages changed
        id: kind
        # A release that changes nothing but the web UI (and docs or tests)
        # keeps the server version of the release before it. Installs that are
        # on that server then replace just their pages: no database backup, no
        # install script, no restart. The server's own tests are skipped, since
        # the server is the one already released and tested.
        run: |
          set -euo pipefail
          server=$VERSION
          ui_only=false
          prev=""
          if [[ "$VERSION" != *-* ]]; then
            prev=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF "$VERSION" | sort -V | tail -n 1 || true)
          fi
          if [ -n "$prev" ] && git fetch --quiet --depth=1 origin "refs/tags/$prev:refs/tags/$prev"; then
            other=$(git diff --name-only "$prev" HEAD | grep -vE '^(frontend/|docs/|README\.md$|CLAUDE\.md$|\.claude/|backend/test/)' || true)
            if [ -z "$other" ]; then
              ui_only=true
              # The server the release before it goes with (itself, when it doesn't say).
              base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$prev"
              server=$(curl -fsSL --retry 3 "$base/UPDATE.json" 2>/dev/null | sed -nE 's/.*"server":"(v[0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' || true)
              [ -n "$server" ] || server=$prev
            else
              echo "Changed outside the pages since $prev:"; echo "$other" | head -n 20
            fi
          fi
          echo "Release before this one: ${prev:-none}; pages only: $ui_only; server version: $server"
          echo "ui_only=$ui_only" >> "$GITHUB_OUTPUT"
          echo "SERVER_VERSION=$server" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install image build tools
        if: steps.template.outputs.build == 'true'
        # mmdebstrap and Debian's archive keyring come straight from Debian's
        # servers (which the template build uses anyway), not from the
        # runner's Ubuntu mirrors, which are often unreachable from GitHub.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          get() { curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 "$1" -o "$2"; }
          get https://deb.debian.org/debian/dists/bookworm/main/binary-all/Packages.xz "$work/Packages.xz"
          # The keyring of the release being built knows that release's signing keys.
          get "https://deb.debian.org/debian/dists/$SUITE/main/binary-all/Packages.xz" "$work/Packages-suite.xz"
          for pkg in debian-archive-keyring mmdebstrap; do
            list="$work/Packages.xz"; [ "$pkg" = debian-archive-keyring ] && list="$work/Packages-suite.xz"
            read -r file sum < <(xz -dc "$list" | awk -v p="$pkg" '
              $1 == "Package:" { hit = ($2 == p) }
              hit && $1 == "Filename:" { f = $2 }
              hit && $1 == "SHA256:" { s = $2 }
              hit && f && s { print f, s; exit }') || true
            [ -n "$file" ] || { echo "::error::$pkg not found on deb.debian.org"; exit 1; }
            get "https://deb.debian.org/debian/$file" "$work/$pkg.deb"
            echo "$sum  $work/$pkg.deb" | sha256sum -c -
          done
          # Its dependencies (perl, apt) are already on the runner.
          sudo dpkg -i --force-depends "$work/debian-archive-keyring.deb" "$work/mmdebstrap.deb"
          command -v zstd >/dev/null
          mmdebstrap --version

      - name: PostgreSQL 18 client tools
        if: steps.kind.outputs.ui_only != 'true'
        # The tests dump and restore the service's PostgreSQL 18 databases, which
        # needs pg_dump and pg_restore of that version (the runner has 16).
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo sh deploy/pgdg.sh
          sudo apt-get update -q -o Dir::Etc::sourcelist="sources.list.d/pgdg.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y -q postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Build release tarball
        run: make release VERSION="$VERSION" SERVER_VERSION="$SERVER_VERSION"

      - name: Unit tests and type checks
        if: steps.kind.outputs.ui_only != 'true'
        run: make test

      - name: The pages' tests and type checks
        if: steps.kind.outputs.ui_only == 'true'
        run: cd frontend && npm run check && npm test

      - name: Integration tests (PostgreSQL)
        if: steps.kind.outputs.ui_only != 'true'
        run: make test-integration TEST_DATABASE_URL="postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"

      - name: Build LXC template
        if: steps.template.outputs.build == 'true'
        run: |
          mkdir -p dist/template
          sudo deploy/lxc-template/build-lxc-template.sh \
            --suite "$SUITE" --version "$VERSION" --out dist/template \
            --release "dist/ledger-$VERSION-linux-amd64.tar.gz"
          sudo chown -R "$(id -u):$(id -g)" dist
          # The same file name every time, so its download URL never changes.
          cd dist/template
          built=$(ls ./*-ledger_"$VERSION"_amd64.tar.zst)
          stable=$(basename "$built" | sed "s/_${VERSION}_/_/")
          mv "$built" "$stable"
          sha256sum -- "$stable" > SHA256SUMS
          cat SHA256SUMS
          echo "TEMPLATE_FILE=$stable" >> "$GITHUB_ENV"

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- "ledger-$VERSION-linux-amd64.tar.gz" "ledger-web-$VERSION.tar.gz" > SHA256SUMS
          cat UPDATE.json
          cat SHA256SUMS

      - name: Release notes
        run: |
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$VERSION"
          tpl="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TEMPLATE_TAG"
          cat > notes.md <<EOF
          ## Proxmox LXC template

          The container template is not rebuilt for every release: download it from
          [the LXC template release]($tpl). A container made from it installs this
          release (or whatever is newest) on its first boot. Existing containers update
          from the **Updates** page as usual.

          ## Release tarball (one-command deploy or upgrade)

          \`ledger-$VERSION-linux-amd64.tar.gz\` holds the server, its Node.js runtime, SQL and deploy scripts:

          \`\`\`sh
          tar xzf ledger-$VERSION-linux-amd64.tar.gz && cd ledger-$VERSION-linux-amd64
          ./deploy/proxmox-deploy.sh --csv-path /mnt/pve/truenas/ledger          # new container
          ./deploy/proxmox-deploy.sh --upgrade --ctid <ctid> \\
            --release ../ledger-$VERSION-linux-amd64.tar.gz                    # upgrade
          \`\`\`
          EOF
          cat notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/ledger-"$VERSION"-linux-amd64.tar.gz dist/ledger-web-"$VERSION".tar.gz dist/UPDATE.json dist/SHA256SUMS)
          if gh release view "$VERSION" >/dev/null 2>&1; then
            # Re-run: replace the assets, keep the release.
            gh release upload "$VERSION" "${assets[@]}" --clobber
            gh release edit "$VERSION" --notes-file notes.md
          else
            prerelease=()
            [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
            gh release create "$VERSION" "${assets[@]}" \
              --title "Ledger $VERSION" --notes-file notes.md --target "$GITHUB_SHA" "${prerelease[@]}"
          fi

      - name: Publish the LXC template
        # Into the fixed `lxc-template` release, which must never become the
        # "latest" release: the updater installs whatever that one is.
        if: steps.template.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TEMPLATE_TAG/$TEMPLATE_FILE"
          sum=$(awk '{ print $1 }' dist/template/SHA256SUMS)
          debian="Debian $([ "$SUITE" = trixie ] && echo 13 || echo 12)"
          cat > template-notes.md <<EOF
          ## Proxmox LXC template ($debian)

          This file keeps the same name and URL from one release to the next. It was last
          built with Ledger $VERSION on $(date -u +%Y-%m-%d); a container made from it installs
          the latest Ledger release on its first boot (watch it on the **Updates** page).

          On the Proxmox host (as root), download the template into the local template store:

          \`\`\`sh
          wget -O /var/lib/vz/template/cache/$TEMPLATE_FILE $url
          echo "$sum  /var/lib/vz/template/cache/$TEMPLATE_FILE" | sha256sum -c
          \`\`\`

          If your Proxmox version has **local → CT Templates → Download from URL**, you can
          paste \`$url\` there instead, with hash algorithm **SHA-256** and checksum
          \`$sum\`. Otherwise download the file and use **Upload**.

          Then create an unprivileged container from it (enable **nesting**), bind-mount your
          CSV directory (\`pct set <ctid> -mp0 /mnt/pve/truenas/ledger,mp=/app/csv_data\`),
          start it, and log in as \`admin\` with the password \`1234\`; Ledger then asks
          you to choose your own password or 4-digit passcode.
          Full guide: [docs/DEPLOYMENT.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/DEPLOYMENT.md#alternative-a-ready-made-lxc-template).
          EOF
          assets=(dist/template/"$TEMPLATE_FILE" dist/template/SHA256SUMS)
          if gh release view "$TEMPLATE_TAG" >/dev/null 2>&1; then
            gh release upload "$TEMPLATE_TAG" "${assets[@]}" --clobber
            gh release edit "$TEMPLATE_TAG" --notes-file template-notes.md --latest=false
          else
            gh release create "$TEMPLATE_TAG" "${assets[@]}" --latest=false \
              --title "Ledger LXC template" --notes-file template-notes.md --target "$GITHUB_SHA"
          fi
